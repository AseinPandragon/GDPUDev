# GDPUDev 站点 nginx 配置（腾讯云服务器，兼容 Ubuntu/Debian 与 CentOS/腾讯OS）
# 由 deploy/server-setup.sh 安装到 /etc/nginx/conf.d/gdpudev.conf
#
# 路由规则：
#   http://www.gdpudev.cn/          → 空白页（根路径不展示内容）
#   http://www.gdpudev.cn/gamedev/  → 情报站（唯一入口）

server {
    listen 80;
    listen [::]:80;
    server_name gdpudev.cn www.gdpudev.cn;

    # 站点文件体积小，直接开 gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 根路径：返回空白页
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="robots" content="noindex"><title></title></head><body></body></html>';
    }

    # 其余未知路径一律 404
    location / {
        return 404;
    }

    # /gamedev（无尾斜杠）规范化到 /gamedev/
    location = /gamedev {
        return 301 /gamedev/;
    }

    # /gamedev/ 服务站点文件（页面内相对引用如 archive_list.js、data/*.js 均落在 /gamedev/ 下）
    # try_files 支持免后缀访问：/gamedev/roadmap → roadmap.html
    location /gamedev/ {
        alias /var/www/gdpudev/;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }
}
