# GDPUDev 站点 nginx 配置（腾讯云服务器，兼容 Ubuntu/Debian 与 CentOS/腾讯OS）
# 由 deploy/server-setup.sh 安装到 /etc/nginx/conf.d/gdpudev.conf
#
# 站点同时可通过两个地址访问：
#   http://www.gdpudev.cn/          （根路径）
#   http://www.gdpudev.cn/gamedev/  （子路径，同一份文件，无需复制）

server {
    listen 80;
    listen [::]:80;
    server_name gdpudev.cn www.gdpudev.cn;

    root /var/www/gdpudev;
    index index.html;

    # 站点文件体积小，直接开 gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /gamedev（无尾斜杠）规范化
    location = /gamedev {
        return 301 /gamedev/;
    }

    # /gamedev/xxx 内部重写到 /xxx，直接复用根目录同一份站点文件
    location ^~ /gamedev/ {
        rewrite ^/gamedev/(.*)$ /$1 last;
    }

    # 根路径也直接服务站点
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（每日更新的 js 不长缓存）
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.js$ {
        expires 10m;
    }
}
