var S = null;
function newState() {
  return { phase: 'title', day: 1, stats: { design: 0, prog: 0, ta: 0, art: 0, media: 0, tech: 0 },
    hp: 40, hmax: 40, trained: { design: 0, prog: 0, ta: 0, art: 0, media: 0, tech: 0 },
    buffs: [], idleDays: 0, kills: 0, speed: 1 };
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { var s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function getDex() { try { return JSON.parse(localStorage.getItem(DEX_KEY) || '[]'); } catch (e) { return []; } }
function markEnding(id) { try { var d = getDex(); if (d.indexOf(id) < 0) { d.push(id); localStorage.setItem(DEX_KEY, JSON.stringify(d)); } } catch (e) {} }
function topClass() {
  var best = 'design';
  for (var k in S.stats) if (S.stats[k] > S.stats[best]) best = k;
  return best;
}
function power() { var t = 0; for (var k in S.stats) t += S.stats[k]; return t; }
function rating() { var p = power(); return p >= 50 ? 'S · 开发者之魂' : p >= 40 ? 'A · 出师' : p >= 28 ? 'B · 入门' : 'C · 火种未熄'; }
function buff(id) { var n = 0; S.buffs.forEach(function (b) { if (b === id) n++; }); return n; }
function wrap() { return document.getElementById('gameWrap'); }
function show(html) { wrap().innerHTML = html; window.scrollTo(0, 0); }

}

  S = newState(); S.phase = 'title';
  var hasSave = !!load();
  var dex = getDex();
  var h = '<div class="rb-panel rb-endcard">';
  h += '<div class="t">重 生</div><div class="rb-tag" style="text-align:center">游戏降临前的七天 · SEVEN DAYS BEFORE THE DESCENT</div>';
  h += '<div class="d" style="margin-bottom:16px">2026 年 10 月 8 日凌晨，「大降临」——所有游戏里的怪物走进了现实。只有亲手<em>做过游戏</em>的人，才能看见它们的血条与弱点。<br><br>你是个只会玩游戏的学生。前世你躲了三天，死在一只怪物的碰撞箱下。<br><br>再睁眼：<b style="color:#edbe5c">9 月 30 日 23:47，国庆前夜。</b><span class="sys">【开发者系统已激活】距离大降临还有 7 天。<br>把你自己，练成一个游戏开发者。</span></div>';
  h += '<button class="rb-btn gold" style="text-align:center" onclick="startPrologue()">▶ 开始七天</button>';
  if (hasSave) h += '<button class="rb-btn" style="text-align:center" onclick="resume()">↻ 继续上次的进度（第 ' + load().day + ' 天）</button>';
  h += '<div style="margin-top:14px"><div class="rb-tag">结局图鉴 · ' + dex.length + ' / 14</div><div class="rb-dex">';
  for (var id in ENDINGS) h += '<div class="' + (dex.indexOf(id) >= 0 ? 'got' : '') + '">' + (dex.indexOf(id) >= 0 ? ENDINGS[id].got + ' · ' + ENDINGS[id].t : '？？？') + '</div>';
  h += '</div></div></div>';
  show(h);
}
function startPrologue() { S = newState(); screenDay(); }
function resume() { var s = load(); if (s) { S = s; screenDay(); } }
function screenDay() {
  var st = DAY_STORY[S.day - 1];
  show(hudHtml() + '<div class="rb-panel"><div class="rb-tag">DAY ' + S.day + ' · ' + st[0] + '</div><div class="rb-story">' + st[1] + '</div><button class="rb-btn gold" style="text-align:center;margin-top:12px" onclick="screenAction()">开始这一天 ▶</button></div>');
  S.phase = 'day'; save();
}
function screenAction() {
  var h = hudHtml() + '<div class="rb-panel"><div class="rb-tag">白天 · 今天怎么肝？</div>';
  ACTIONS.forEach(function (a, i) {
    var trained = a.k !== 'idle' ? S.trained[a.k] : 0;
    var buildNote = a.k !== 'idle' && trained < 3 ? '<span class="sub">当晚解锁 ' + CLASSES[a.k].name + ' Build ' + (trained + 1) + '：' + CLASSES[a.k].builds[trained].name + '</span>' : (a.k !== 'idle' ? '<span class="sub">该职业 Build 已全部解锁</span>' : '<span class="sub">打游戏不算虚度：你在研究优秀设计</span>');
    h += '<button class="rb-btn" onclick="doAction(' + i + ')">' + a.t + ' <span style="color:' + (CLASSES[a.k] ? CLASSES[a.k].color : '#7ed696') + '">『' + a.s + '』</span><span class="sub">' + a.d + '</span>' + buildNote + '</button>';
  });
  h += '</div>';
  show(h); S.phase = 'action'; save();
}
function doAction(i) {
  var a = ACTIONS[i];
  if (a.k === 'idle') { S.hp = S.hmax; S.idleDays++; var ks = Object.keys(S.stats); S.stats[ks[Math.floor(Math.random() * ks.length)]] += 2; }
  else { S.stats[a.k] += 3; S.trained[a.k] = Math.min(3, S.trained[a.k] + 1); }
  screenPrep();
}
function currentClass() { return topClass(); }
function unlockedBuildIdx(cls) { return Math.min(3, S.trained[cls] || 1); }
function screenPrep() {
  var isBoss = S.day === 7;
  var mon = isBoss ? BOSS : MONSTERS[S.day - 1];
  var cls = currentClass();
  var nb = unlockedBuildIdx(cls);
  var h = hudHtml() + '<div class="rb-panel"><div class="rb-tag">夜幕 · ' + (isBoss ? '降临日决战' : '遭遇战') + '</div>';
  h += '<div class="rb-monname">' + mon.emoji + ' ' + mon.name + '</div><div style="color:#9fb3aa;font-size:13px;line-height:1.9;margin-top:6px">' + mon.desc + '</div>';
  h += '<div class="rb-monhp"><i style="width:100%"></i></div><div class="rb-hud" style="margin-top:8px"><span>怪物耐久 <b>' + mon.hp + '</b></span><span>怪物攻击 <b>' + mon.dmg + '/发</b></span></div>';
  h += '<div class="rb-buffline">你的加成：' + (S.buffs.length ? S.buffs.map(function (b) { var r = ROGUE_POOL.filter(function (p) { return p.id === b; })[0]; return r ? r.t : b; }).join(' / ') : '暂无（赢下遭遇战可获得）') + '</div>';
  if (nb > 1) {
    h += '<div class="rb-tag" style="margin-top:14px">选择今晚的 Build（' + CLASSES[cls].name + '）</div><div class="rb-choices" id="buildPick">';
    for (var i = 0; i < nb; i++) {
      var b = CLASSES[cls].builds[i];
      h += '<button class="rb-btn' + (i === nb - 1 ? ' active' : '') + '" data-i="' + i + '" onclick="pickBuild(this,' + i + ')">' + b.name + '<span class="sub">' + b.desc + '</span></button>';
    }
    h += '</div>';
  } else {
    h += '<div class="rb-buffline" style="margin-top:10px">Build：' + CLASSES[cls].builds[0].name + '（' + CLASSES[cls].builds[0].desc + '）</div>';
  }
  h += '<button class="rb-btn gold" style="text-align:center;margin-top:12px" onclick="startBattle()">⚔ 开战（自动战斗）</button>';
  h += '<div class="rb-buffline" style="color:#55665f">战斗全自动：扔弹与技能由 Build 自动释放，打不过就死——死了会有结局，但本局进度清空。</div></div>';
  show(h); S.phase = 'prep';
  S.pendingBuild = nb - 1; save();
}
function pickBuild(el, i) {
  S.pendingBuild = i;
  var btns = document.querySelectorAll('#buildPick button');
  for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
  el.classList.add('active');
}
/* ---- 自动战斗引擎（canvas） ---- */
var B = null, RAF = null;
function startBattle() {
  var isBoss = S.day === 7;
  var mon = isBoss ? BOSS : MONSTERS[S.day - 1];
  var cls = currentClass();
  var stat = S.stats[cls];
  B = {
    mon: mon, cls: cls, isBoss: isBoss,
    mhp: mon.hp, mmax: mon.hp,
    php: S.hp, pmax: S.hmax,
    dmg: (3 + 0.55 * stat) * (1 + 0.25 * buff('dmg')),
    interval: 0.8 / (1 + 0.2 * buff('spd')),
    crit: 0.15 * buff('crit'),
    vamp: buff('vamp') > 0 ? 0.05 + 0.05 * buff('vamp') : 0,
    regen: 0.5 * buff('regen'),
    skillDmg: 1 + 0.4 * buff('skill'),
    cdMul: Math.max(0.3, 1 - 0.15 * buff('cdr')),
    build: CLASSES[cls].builds[S.pendingBuild || 0], buildIdx: S.pendingBuild || 0,
    t: 0, lastThrow: 0, lastSkill: 0, mLast: 0,
    shots: [], mshots: [], floats: [], dead: false, over: false, speed: 1, stun: 0, mVuln: 1, mDots: [], summons: 0, hyper: 0
  };
  show('<div class="rb-panel"><div class="rb-tag">遭遇战 · ' + mon.name + '</div><div class="rb-speed"><button onclick="cycleSpeed()" id="spdBtn">速度 ×' + B.speed + '</button></div><div id="cvWrap" style="position:relative"><canvas id="battleCanvas" width="720" height="420"></canvas></div><div class="rb-buffline" style="text-align:center">你的 Build：' + B.build.name + ' —— 战斗全自动，看戏就好</div></div>');
  B.cv = document.getElementById('battleCanvas');
  B.ctx = B.cv.getContext('2d');
  B.last = performance.now();
  RAF = requestAnimationFrame(loop);
}
function cycleSpeed() { B.speed = B.speed === 1 ? 2 : B.speed === 2 ? 4 : 1; document.getElementById('spdBtn').textContent = '速度 ×' + B.speed; }
function floatText(x, y, txt, color) { B.floats.push({ x: x, y: y, txt: txt, c: color, t: 0 }); }
function loop(now) {
  if (!B || B.over) return;
  var dt = Math.min(0.05, (now - B.last) / 1000) * B.speed;
  B.last = now; B.t += dt;
  var W = B.cv.width, H = B.cv.height;
  var px = W / 2, py = H - 70, mx = W / 2, my = 80;
  /* 玩家扔弹 */
  if (B.t - B.lastThrow >= B.interval) {
    B.lastThrow = B.t;
    var dmg = B.dmg * (Math.random() < B.crit ? 2 : 1);
    if (B.buildIdx === 0 && B.cls === 'design') dmg = B.dmg * (0.5 + Math.random() * 2.5);
    B.shots.push({ x: px, y: py - 24, vy: -430, dmg: dmg, glyph: CLASSES[B.cls].ammo[Math.floor(Math.random() * 3)] });
  }
  /* Build 技能（自动释放） */
  var sk = skillTick(dt, px, py, mx, my);
  /* 怪物攻击（不被躲，纯数值对轰） */
  if (B.stun <= 0 && B.t - B.mLast >= 1.4) {
    B.mLast = B.t;
    B.mshots.push({ x: mx + (Math.random() * 120 - 60), y: my + 30, vy: 260, dmg: B.mon.dmg, glyph: '❓' });
  }
  B.stun = Math.max(0, B.stun - dt);
  if (B.regen > 0) B.php = Math.min(B.pmax, B.php + B.regen * dt);
  /* 弹道推进与命中 */
  for (var i = B.shots.length - 1; i >= 0; i--) {
    var s = B.shots[i]; s.y += s.vy * dt;
    if (s.y <= my + 30) { hitMonster(s.dmg, s.x, my + 20); B.shots.splice(i, 1); }
  }
  for (var i2 = B.mshots.length - 1; i2 >= 0; i2--) {
    var m = B.mshots[i2]; m.y += m.vy * dt;
    if (m.y >= py - 20) { hitPlayer(m.dmg); B.mshots.splice(i2, 1); }
  }
  /* 胜负 */
  if (B.mhp <= 0 && !B.over) { endBattleWin(); return; }
  if (B.php <= 0 && !B.over) { endBattleDeath(); return; }
  render(px, py, mx, my);
  RAF = requestAnimationFrame(loop);
}
function skillTick(dt, px, py, mx, my) {
  var c = B.cls, bi = B.buildIdx, base = B.dmg * B.skillDmg;
  var fire = function (d, extra) {
    var dmg = d * (1 + (B.mVuln > 1 ? B.mVuln - 1 : 0));
    hitMonster(dmg, mx, my + 20);
  };
  if (c === 'prog') {
    if (bi === 0) { B.interval = 0.8 / (1 + 0.2 * buff('spd')) / 1.4; }
    else if (bi === 1 && B.t - B.lastSkill >= 6 * B.cdMul) { B.lastSkill = B.t; fire(base * 4); floatText(mx, my + 60, '⌨ 重锤!', '#6366f1'); }
    else if (bi === 2 && B.t - B.lastSkill >= 6 * B.cdMul) { B.lastSkill = B.t; B.summons = 2; }
  } else if (c === 'design') {
    if (bi === 1 && B.t - B.lastSkill >= 8 * B.cdMul) { B.lastSkill = B.t; fire(base * 5); B.stun = 1.5; floatText(mx, my + 60, '📋 眩晕!', '#34d399'); }
    else if (bi === 2) { B.mhp -= base * 1.2 * dt; }
  } else if (c === 'ta') {
    if (bi === 0 && B.t - B.lastSkill >= 5 * B.cdMul) { B.lastSkill = B.t; fire(base * 3.5); floatText(mx, my + 60, '✨ Ray!', '#8b5cf6'); }
    else if (bi === 1 && B.t - B.lastSkill >= 4 * B.cdMul) { B.lastSkill = B.t; fire(base * 1.5); fire(base * 1.5); }
    else if (bi === 2 && B.t - B.lastSkill >= 10 * B.cdMul) { B.lastSkill = B.t; fire(base * 8); floatText(mx, my + 60, '💥 光追爆发!', '#8b5cf6'); }
  } else if (c === 'art') {
    if (bi === 0 && B.t - B.lastSkill >= 5 * B.cdMul) { B.lastSkill = B.t; fire(base * 2); }
    else if (bi === 1 && B.t - B.lastSkill >= 9 * B.cdMul) { B.lastSkill = B.t; fire(base * 6); floatText(mx, my + 60, '🖌 入魂!', '#f59e0b'); }
    else if (bi === 2) { B.mhp -= base * 0.25 * dt; }
  } else if (c === 'media') {
    if (bi === 0) { B.mhp -= base * 0.8 * dt; }
    else if (bi === 1) { B.mVuln = 1.3; }
    else if (bi === 2 && B.t - B.lastSkill >= 12 * B.cdMul) { B.lastSkill = B.t; fire(base * 10); floatText(mx, my + 60, '👍 一键三连!', '#ec4899'); }
  } else if (c === 'tech') {
    if (bi === 0 && B.t - B.lastSkill >= 7 * B.cdMul) { B.lastSkill = B.t; B.mshots = []; fire(base * 2); floatText(mx, my + 60, '🔧 GC!', '#94a3b8'); }
    else if (bi === 1 && B.t - B.lastSkill >= 12 * B.cdMul) { B.lastSkill = B.t; B.hyper = 10; floatText(px, py - 40, '⚡ 超频!', '#94a3b8'); }
  }
  /* tech B3 指针流（独立计时） */
  if (c === 'tech' && bi === 2 && B.t - (B.lastPtr || 0) >= 5 * B.cdMul) {
    B.lastPtr = B.t; hitMonster(B.dmg * B.skillDmg * 4, mx, my + 20); hitPlayer(3);
  }
  if (c === 'prog' && B.summons > 0 && B.t - B.lastThrow >= B.interval * 2) {
    fire(B.dmg * 0.3 * B.summons);
  }
  /* 持续伤害 */
  var dotTotal = 0;
  B.mDots.forEach(function (d) { dotTotal += d.dps * dt; });
  if (dotTotal > 0) { B.mhp -= dotTotal * (B.mVuln > 1 ? B.mVuln : 1); }
  if (B.hyper > 0) { B.hyper -= dt; B.interval = 0.8 / (1 + 0.2 * buff('spd')) / (B.cls === 'prog' && B.buildIdx === 0 ? 1.4 : 1) * 0.5; }
}
function hitMonster(dmg, x, y) {
  if (B.over || B.mhp <= 0) return;
  B.mhp -= dmg;
  if (B.vamp > 0) B.php = Math.min(B.pmax, B.php + dmg * B.vamp);
  B.floats.push({ x: x, y: y, txt: '-' + Math.round(dmg), c: '#f07a70', t: 0 });
}
function hitPlayer(dmg) {
  if (B.over) return;
  B.php -= dmg;
  B.floats.push({ x: 360 + (Math.random() * 80 - 40), y: 340, txt: '-' + Math.round(dmg), c: '#f0b8ac', t: 0 });
}
function render(px, py, mx, my) {
  var ctx = B.ctx, W = B.cv.width, H = B.cv.height;
  ctx.clearRect(0, 0, W, H);
  /* 怪物 */
  ctx.font = '52px serif'; ctx.textAlign = 'center';
  ctx.fillText(B.mon.emoji, mx, my + 20);
  ctx.font = '700 15px sans-serif'; ctx.fillStyle = '#f0b8ac';
  ctx.fillText(B.mon.name, mx, my - 44);
  ctx.fillStyle = '#10151c'; ctx.fillRect(mx - 130, my - 38, 260, 10);
  ctx.fillStyle = '#c9453e'; ctx.fillRect(mx - 130, my - 38, 260 * Math.max(0, B.mhp / B.mmax), 10);
  /* 主角 */
  ctx.font = '40px serif'; ctx.fillText('🧑‍💻', px, py + 14);
  ctx.font = '700 13px sans-serif'; ctx.fillStyle = '#9fd3b8';
  ctx.fillText(CLASSES[B.cls].name + ' · ' + B.build.name, px, py + 38);
  ctx.fillStyle = '#10151c'; ctx.fillRect(px - 130, H - 18, 260, 10);
  ctx.fillStyle = '#7ed696'; ctx.fillRect(px - 130, H - 18, 260 * Math.max(0, B.php / B.pmax), 10);
  ctx.font = '11px monospace'; ctx.fillStyle = '#9fb3aa';
  ctx.fillText('意志 ' + Math.max(0, Math.ceil(B.php)) + '/' + B.pmax, px, H - 24);
  /* 弹药 */
  B.shots.forEach(function (s) { ctx.font = '20px serif'; ctx.fillText(s.glyph, s.x, s.y); });
  B.mshots.forEach(function (m) { ctx.font = '18px serif'; ctx.fillText('❗', m.x, m.y); });
  /* 飘字 */
  for (var i = B.floats.length - 1; i >= 0; i--) {
    var f = B.floats[i]; f.t += 0.016 * B.speed;
    if (f.t > 1) { B.floats.splice(i, 1); continue; }
    ctx.font = '900 16px sans-serif'; ctx.fillStyle = f.c; ctx.globalAlpha = 1 - f.t;
    ctx.fillText(f.txt, f.x, f.y - f.t * 30); ctx.globalAlpha = 1;
  }
}
function endBattleWin() {
  B.over = true; cancelAnimationFrame(RAF);
  S.hp = Math.max(1, Math.min(B.pmax, B.php)); S.kills++;
  S.stats[B.cls] += 1;
  if (B.isBoss) { screenBossWin(); return; }
  screenRogue();
}
function endBattleDeath() {
  B.over = true; cancelAnimationFrame(RAF);
  if (S.idleDays >= 7) { showEnding('E_idle'); return; }
  showEnding(B.isBoss ? 'BOSS' : B.mon.dex);
}
function screenRogue() {
  var pool = ROGUE_POOL.slice(), picks = [];
  while (picks.length < 3 && pool.length) picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  var h = hudHtml() + '<div class="rb-panel"><div class="rb-tag">战利品 · 三选一（可叠加）</div>';
  h += '<div class="rb-story" style="margin-bottom:10px">' + MONSTERS[S.day - 1].emoji + ' ' + MONSTERS[S.day - 1].name + ' 化作了数据尘埃。掉落了三块「引擎碎片」——只能拿一块。</div>';
  picks.forEach(function (p, i) {
    h += '<div class="rb-rogue" onclick="pickRogue(\'' + p.id + '\')"><b>▲ ' + p.t + '</b><div class="sub">' + p.d + '</div></div>';
  });
  h += '</div>';
  show(h); S.phase = 'rogue'; save();
}
function pickRogue(id) {
  S.buffs.push(id);
  if (id === 'hp') { S.hmax += 8; S.hp = Math.min(S.hmax, S.hp + 8); }
  screenDayEnd();
}
function screenDayEnd() {
  if (S.day >= 7) { screenBossWin(); return; }
  show(hudHtml() + '<div class="rb-panel"><div class="rb-tag">深夜 · 第 ' + S.day + ' 天结束</div><div class="rb-story">你把今天学到的东西存进记忆，把意志留给明天。<span class="sys">【距离大降临还剩 ' + (7 - S.day) + ' 天】进度已自动保存。</span></div><button class="rb-btn gold" style="text-align:center;margin-top:12px" onclick="nextDay()">睡下 → 第 ' + (S.day + 1) + ' 天 ▶</button></div>');
  S.phase = 'dayend'; save();
}
function nextDay() { S.day++; screenDay(); }
function screenBossWin() {
  /* 通关：职业结局 + 评级 */
  var c = topClass();
  markEnding('E_' + c);
  var dex = getDex();
  show(hudHtml() + '<div class="rb-panel rb-endcard"><div class="rb-tag">10 月 8 日 · 大降临</div><div class="rb-monname" style="margin-bottom:10px">👑 黄金周吞噬者 · 已被击退</div><div class="d rb-story" style="text-align:left">' + ENDING_TEXT.win[c] + '</div><div style="margin-top:14px"><span class="rb-stat" style="background:#edbe5c">结局 · ' + ENDINGS['E_' + c].t + '</span><span class="rb-stat" style="background:#7ed696">战力评级 ' + rating() + '</span><span class="rb-stat" style="background:#9fd3b8">总战力 ' + power() + '</span></div><div class="rb-tag" style="margin-top:14px">你的方向画像</div><div>' + (function () { var s = ''; for (var k in S.stats) s += '<span class="rb-stat" style="background:' + CLASSES[k].color + '">' + CLASSES[k].name.split(' ')[0] + ' ' + S.stats[k] + '</span>'; return s; })() + '</div><div class="rb-tag" style="margin-top:14px">结局图鉴 · ' + dex.length + ' / 14</div><div class="rb-dex">' + dexHtml() + '</div><button class="rb-btn gold" style="text-align:center;margin-top:12px" onclick="restart()">↻ 再来一世（新的一局）</button><button class="rb-btn" style="text-align:center" onclick="location.href=\'quiz\'">想看正式的方向测试？去 QUIZ 页</button></div>');
  clearSave();
}
function showEnding(id) {
  markEnding(id);
  var isIdle = id === 'E_idle';
  var dex = getDex();
  var body = isIdle ? ENDING_TEXT.idle : ENDING_TEXT.death[id];
  var mon = id === 'BOSS' ? BOSS : MONSTERS[parseInt(id.slice(1)) - 1];
  show(hudHtml() + '<div class="rb-panel rb-endcard"><div class="rb-tag">' + (isIdle ? '隐藏结局' : '你死了 · 死于第 ' + S.day + ' 天') + '</div><div class="t">' + ENDINGS[id].t + '</div><div style="font-size:34px;margin-bottom:10px">' + (isIdle ? '🎮' : mon.emoji) + '</div><div class="d">' + body + '</div><div class="rb-tag" style="margin-top:16px">结局图鉴 · ' + dex.length + ' / 14（死了也有收获——这就是多结局的意义）</div><div class="rb-dex">' + dexHtml() + '</div><button class="rb-btn gold" style="text-align:center;margin-top:12px" onclick="restart()">↻ 再重生一次（从第一天开始）</button><button class="rb-btn" style="text-align:center" onclick="location.href=\'quiz\'">不想打了？去做正经方向测试</button></div>');
  clearSave();
}
function dexHtml() {
  var dex = getDex(), h = '';
  for (var id in ENDINGS) h += '<div class="' + (dex.indexOf(id) >= 0 ? 'got' : '') + '">' + (dex.indexOf(id) >= 0 ? ENDINGS[id].got + ' · ' + ENDINGS[id].t : '？？？') + '</div>';
  return h;
}
function restart() { clearSave(); S = newState(); screenDay(); }
screenTitle();
</script>
