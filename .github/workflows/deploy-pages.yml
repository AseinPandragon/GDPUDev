name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 允许工作流自带的 GITHUB_TOKEN 开通（创建）Pages 站点：开通属于仓库管理操作，
  # 需要 administration:write，仅 pages:write 只能往已存在的站点部署。
  administration: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时，由工作流自带 GITHUB_TOKEN（含 pages:write、对仓库有 admin 等价权限）
          # 自动创建站点并设为 GitHub Actions 构建源，避免每次 push 都在 configure-pages 步 404 失败。
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
