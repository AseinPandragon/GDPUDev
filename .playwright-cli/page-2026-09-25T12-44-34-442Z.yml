                          - paragraph: 首先，我建议不要盲目入坑，先了解一下游戏次世代建模这个专业，薪资情况，行业前景等，了解之后你是否还要义无反顾地进到这个行业吗？这需要对游戏行业、对游戏建模感兴趣，兴趣是学习的第一动力，如果对整个行业和职业完全不感兴趣，那么即使你进入这个行业也必然不会长久。
                          - figure
                          - paragraph: 如果你决定好了要走这个方向，就看是自学，网课，报实体班，用什么方式进行学习。次世代需要用到的软件就有10多款，流程低模，高模，UV，烘焙，贴图，渲染，而且，次世代建模专业的性质是一个实操性比较强的专业，零基础小白，首先排除一下自学的方式。想学习游戏建模，并以此为吃饭的工具，千万不要贪便宜，很多人说，想要自学建模，其实我并不支持零散地学习建模，网上查找的资料很细碎，不能带来好的体验，还是建议：好好地报系统的班级，跟着专业的老师学习，这样学习起来才是事半功倍的。
                          - paragraph: 所以我们真想进入游戏行业，从事游戏建模工作，那么我们还是需要找一家专业的培训机构，进行系统的、规范的、全流程的学习，这样可以让我们少走弯路，用最短的时间学习到最丰富的的知识。
                          - figure
                          - paragraph: 次世代入门学习内容包括美术基础，软件基础（3Dmax，ZBrush，PS）
                          - paragraph: 主要包括：3Dmax基础、UV拆分和摆放、贴图绘制基础。
                          - paragraph: （1）底模软件（3dmax或Maya）
                          - paragraph: 你可以从基础的3D建模软件学起了，它可以是3Dmax、或者Maya，选择精通其中一款就可以了，没必要两款都学，这会占用你大量时间也没什么意义。
                          - paragraph: （2）高精模型软件（ZBrush）
                          - paragraph: 在3D Max或Maya中完成了模型搭建，加下来需要有细节处理的地方，就可以用到Zbrush软件来精细雕刻。上述提及到的软件，是游戏建模师，需要掌握的最核心技能。与此同时，在制作模型材质贴图过程中，往往还需要用到Photoshop做后期处理，用到Bodypain 3D来制三维纹理。
                          - figure
                          - paragraph: PS:所以想要学习3D游戏建模的小伙伴也需要打好基础
                          - paragraph: 完整3D建模次世代游戏建模的制作流程主要包括
                          - paragraph: 3Dmax建中模，ZB雕刻高模，maya拓扑低模，mayaUV拆分，toolbag或SP烘焙贴图，SP绘制材质，八猴渲染。
                          - figure
                          - paragraph: 渡过了最要紧的初学阶段，剩下的就是积累了，积累的东西还是蛮多的，但最重要的就是一点:审美。如果说最开始凭的是对各种软件的掌握度，那么掌握以后，最重要的就是审美了，因为入行以后，你的学习能力会呈现积累性的上升，软件只会越学越快，好比你之前啃熟了MAYA，ZB，MAX，那现在让你去学BLENDER，速度肯定和刚开始接触软件那时相比会快的多，因为软件都是互通的，都是基于电脑这一个操作终端，它脱离不了这个范畴。
                          - figure
                          - paragraph: 如需详细学习教程，作为从事3D游戏建模培训的老司机，也整理了不少学习资料，想正儿八经学习技术的小伙伴，可以单扣我让你有一个明确的学习路线，可能跟你同期接触建模的朋友，他还在无厘头找资源的时候，你就已经有了一个明确的学习方向，多出很多时间专门练习来提升自己!
