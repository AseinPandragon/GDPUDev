                        - generic:
                          - paragraph: 次世代游戏角色制作通过颜色贴图、高光贴图、法线贴图、自发光贴图多种贴图丰富模型细节，区别不同物体的质感，最后再用引擎呈现。
                          - paragraph
                          - figure
                          - paragraph
                          - paragraph: 模型制作
                          - paragraph: 次世代游戏角色制作过程相对繁琐。高模烘培、制作贴图都是比较花时间，调整法线也会占用不少时间。开始的模型制作尽量少的面数表现更多细节，原则是布线均匀、合理，保证在ZBrush中细分后模型都能刷上细节。一句话，就是以精简的低模表现出高模的效果。
                          - paragraph: 开始做出的低精度模型类似于以往网络游戏中的角色效果。但这个简模中，物体结构可以做得非常概括，但所有结构的位置一定要非常准确。确保后面制作的高精度模型整体形状到位。
                          - paragraph: 总之，模型布线要合理规范，角色的制作配合动画合理布线，每个点每条边都要有存在的意义。
                          - generic:
                            - link:
                              - /url: https://link.zhihu.com/?target=https%3A//www.bilibili.com/video/BV1Ua411c7c1
                          - figure
                          - paragraph
                          - paragraph: ZB雕刻
                          - paragraph: 模型建设之后，建模好的游戏角色导入ZBrush雕刻高模。
                          - paragraph: 像素描一样，先画整体大型，从整体入手不断丰富细节（建模也是这样的流程）。雕刻过程抓住角色特征，表现不同质感。
                          - paragraph
                          - figure
                          - paragraph
                          - paragraph: 拓扑低模
                          - paragraph: ZB雕刻模型是高模，面数很考验电脑性能，需要将高细分的模型拓扑出所需要的低模。
                          - paragraph: 低模以比较少面数表现高模大体造型，细节结构主要靠法线体现出来。
                          - paragraph: 拆分UV
                          - paragraph: UV分法有很多，但最终目的是UV不拉伸情况下，最大像素显示贴图。拆分UV需要注意的几个事项。
                          - paragraph: 拆分UV注意事项
                          - list:
                            - listitem: UV不要拆得太碎
                          - paragraph: 拆的太碎，边缘磨损没办法显示出来。
                          - list:
                            - listitem: UV切割线放在较为隐蔽的地方
                          - paragraph: 切割放在看不见的地方，切割线放在明显的地方，影响到后期贴图效果。
                          - list:
                            - listitem: 图像大小一样
                          - paragraph: 每个UV的图像大小一样，UV大小影响贴图分辨率。如果有部分UV像素大，有的像素小，制作出来的场景或人物部分清晰，部分模糊。
                          - list:
                            - listitem: 合理摆放
                          - paragraph: 合理摆放UV，节省空间。这决定以后贴图的像素和质量。
                          - paragraph
                          - figure
                          - paragraph
                          - paragraph: 烘焙法线
                          - paragraph: 法线是始终垂直于某平面的虚线，表示光线射向平面的角度时，通常使用光线和该点法线角度表示。这意味将一个贴图上所有点的法线记录下来，可以利用这些信息实现后期假凹凸效果。
                          - paragraph
                          - figure
                          - paragraph
                          - paragraph: 绘制贴图
                          - paragraph: 次世代贴图是由彩色贴图（Color map）、法线贴图（Normal map）、高光贴图（Specular map）、凹凸贴图（Bump map）的组合而成的一整套贴图。
                          - paragraph
                          - figure
                          - paragraph
                          - paragraph: 次世代的贴图相当强调真实度，要营造虚拟的游戏世界，需要和真实的世界有一定的关联，除了要有审美能力之外，要对真实世界细节有观察力，把元素和细节表现在贴图上。
                          - paragraph: 可用软件有
                          - paragraph: Substance Painter .Quixel SUITE.mari.Bodypaint.Mudbox,等
                          - paragraph
                          - generic:
                            - link:
                              - /url: https://link.zhihu.com/?target=https%3A//www.bilibili.com/video/BV1rK4y1E7B4/
                          - figure
                          - paragraph
                          - paragraph: 进入引擎
                          - paragraph: 所有模型和贴图都完成后，导入到引擎。贴图连接到对应的节点上，根据灯光对材质质感进行参数上调整。
                          - paragraph: 在你有一定的经济基础的情况下，建议大家参加线上课程。
                          - paragraph: 至于为什么不是线下课程。首先成本真的很高，毕竟动辄2-3w的学费，学习期间缺少的收入，异地学习可能产生的路费、生活费，每一个拿出来都不是小事。可能有的机构老师会告诉你，“没关系，培训到一半有一定基础之后你就能出去接点外包补贴了”。但真的可能吗？且不说学到一半时候的技术如何，就只说时间上的安排就不可能了（学习任务本来就很紧张了，怎么可能抽出时间去做外包？）
                          - paragraph: 方便程度不够也是线下课不可忽视的一个缺点——毕竟学校固定的开班地点就那几个，要想去系统学习，只能到学校去，而如果你心仪的学校和你是异地，那么食宿行你都需要进行考虑。虽然有的学校也会提供住宿，但也有不会提供住宿的学校。
                          - paragraph: 就算是线下教育，操作都还是在电脑上演示，一个班都会有很多学生，换算下来，一个老师在你身上花费的时间，其实也并不会很多。即使是在线下，更多都还是靠自觉啊。你不去做，不去主动追求，老师也都不会时时刻刻盯着你。
                          - paragraph: 至于为什么推荐线上教学，我本人就是在线上学习出来的，并且，现在也在关注着行业的新动向，有好的技术，好的软件可以跟快捷，能做出更优质的作品来，我也是愿意去花钱购买这个技术。
                          - paragraph: 不要想着花钱，自己就是吃亏。为知识付费，永远不会吃亏。
                          - paragraph
                          - figure
                          - paragraph
                          - paragraph: 线上课最大的优点之一，就是时间灵活，学习便利，不管你在什么地方：上班午休、下班回家、出差办事、走亲访友，甚至上下班的通勤路上，都可以随时随地去观看教程，相对于线下课而言，无论是时间上还是地域上自由度都更高。这个也是我优先选择线上教学的理由。
                          - paragraph: 这也是很多人选择线上课的一个原因，即线上课的售价往往较低。对比线下课动辄2/3万的学费，线上课，次世代游戏建模报价在一万左右，说线下课还不会产生额外的食宿行费用，这样在你资金比较充足的情况下，购买课程后，之后的生活上也不会有那么大的压力。
                          - paragraph: 线上教学具有时间灵活、不受地域限制且学习成本相对较低的优点，所以相对而言，线上教学的选择面也更广（水也更深，大家不要乱报，有啥问题，可以来问问我），可以不受地域限制地选择自己喜欢的学校、喜欢的老师进行学习。
                          - paragraph: 此外，线上课的受众相对线下课而言受众也更广，不管你是在校学生还是已经工作多年，不管你是想要从业还是单纯兴趣，都能找到适合自己的课程。
