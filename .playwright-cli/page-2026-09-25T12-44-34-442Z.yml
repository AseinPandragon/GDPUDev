                        - generic:
                          - paragraph: 谢邀。专业不符又想进这行工作建议直接报班系统学，效率会高一点。现在的游戏建模门槛很高，自学很难达到公司的要求水平，所以题主说想以工作为目的，我建议你还是不要自学了，关于网课和线下课的优劣可以看看我的这篇文章哈：
                          - generic:
                            - link "游戏次世代封峰：如何选择3D建模课程？网络班好还是实体班好？分别适合哪种人学习呢？ 30 赞同 · 12 评论 文章":
                              - /url: https://zhuanlan.zhihu.com/p/73027345
                              - generic:
                                - generic: 游戏次世代封峰：如何选择3D建模课程？网络班好还是实体班好？分别适合哪种人学习呢？
                                - generic:
                                  - text: 30 赞同 · 12 评论
                                  - generic: 文章
                          - paragraph: 最后不管你是选择哪种方式，学习3D建模都应该由浅入深，我见过很多同学啥都不会上来就直接开始做人体，这种方法费时费力做到最后发现基本大型都是错的。这里我整理了一下自己的线下课程思路，你可以参考这个思路进行学习：
                          - heading "1.美术基础：头骨和木板、石头雕刻" [level=2]
                          - figure
                          - paragraph: 首先从人体头骨上手，头骨是雕好角色的基本，也是3D建模的基础，先掌握头骨的大型，型准之后再慢慢雕牙齿，眼眶这些细节，只有头骨雕好了以后做人的模型才会准确。这一步可以尝试通过Zbrush完成。（没有美术基础的需要同步学习美术基础，建议从素描开始。）
                          - figure
                          - figure
                          - paragraph: 场景练习先从木板，木块开始练习，掌握木头的软硬。
                          - figure
                          - paragraph: 然后是石头，木头石头都练好了之后可以尝试做一些木头和石头相结合的树的练习↓
                          - figure
                          - figure
                          - paragraph: 可以看到在这之前几乎都是用的Zbrush这款软件，因为Zbrush这款软件更容易上手，之后进3Dmax可能会轻松一些。不至于很快“自闭”
                          - heading "2.进阶练习：小型物件" [level=2]
                          - paragraph: 基础练好之后可以开始尝试用3Dmax搭建一些简单的小场景，比如刀剑、箱子、枪，盾牌等，这个时候应该基础比较牢靠了，3D中模建好之后再到ZB雕一下细节部分，多找一些素材观察，实在做不好可以先不用模型做，用素描临摹也可以。这一步主要掌握3Dmax做中模以及Zbrush雕刻高模，熟悉3Dmax的核心操作和Zbrush常用笔刷。
                          - figure
                          - figure
                          - figure
                          - figure
                          - figure
                          - heading "3.综合练习：大型物件及人体" [level=2]
                          - paragraph: 小型场景练好之后可以开始做一些复杂的场景或人体了，比如盔甲、车、人头等，这一步算是次世代核心流程了，一定要多找东西反复练习反复修改，把大型作准细节做丰富。练习到这里主要练习topogun拓扑低模，Maya拆UV，贴图烘焙以及SP材质，MD布料等。
                          - figure
                          - figure
                          - figure
                          - heading "4.项目实战：独立完成一个大型角色/场景作品" [level=2]
                          - paragraph: 最后，利用所学到的技能开始做一个大型综合作品，可以是角色也可以是场景，你就可以用这个“毕业作品”找工作了。
                          - figure
                          - figure
                          - figure
                          - paragraph: 其实高模完成后已经可以尝试去找工作，如果你想让自己作品再完美一些可以再给他们上一些材质打光然后渲染出来，效果可能会更惊艳：
                          - figure
                          - figure
                          - figure
                          - paragraph: 上面所有的图都是我的学生作品，这些作品不一定完美但都是他们按照这个课程提纲一步步做出来的真实作品，题主学习的每个阶段能够到他们的效果就差不多了（这些同学的作品刚发出来都很顺利找到工作啦~）从零开始到最后的作品整个过程大概6个月，如果你要自学可能会稍微慢一点点，但是不论什么方式一定要保证质量，还有最好找一个懂行的人帮你随时看看模型，一条死路走到头可是很痛苦的。
                          - paragraph: 更多学生作品和课程可以关注我的公众号：盛绘艺点
