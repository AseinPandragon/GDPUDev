                - paragraph [ref=f17e154]: 5、之前是做别的职业的，现在转行学习UI设计晚不晚？
                - paragraph [ref=f17e155]: 不晚呢，面试的时候主要是看你的能力和作品，不过作为新人，年龄相对比较大的话，会有劣势，跟学历差不多，在相同能力的情况下，面试官会选择年龄更小的，因为无家庭负担，有潜力，易培养，但是不要灰心哦，用作品打败他们，加油~
