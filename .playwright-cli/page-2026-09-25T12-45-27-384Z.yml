                  - text: ，或者策划去设计，属于UI中后期需要学习和了解的知识点
                - paragraph [ref=f17e193]: 所以新人入行主要学习的是界面美观的整体设计，下面就说说UI的基础工作内容吧
                - paragraph [ref=f17e194]: (为了方便理解，接下来用王者荣耀作为举例)
                - heading "part3：界面美观的整体设计" [level=2] [ref=f17e195]
                - paragraph [ref=f17e196]: 1.主界面
                - paragraph [ref=f17e197]: 主界面主要是玩家信息，系统功能入口，以及核心玩法入口的总汇，介于每款游戏都会根据自身产品的特点，设计主界面，所以这里就不展开说了
                - paragraph
                - figure [ref=f17e198]
                - paragraph
                - paragraph [ref=f17e202]: 2.一级界面
                - paragraph [ref=f17e203]: 一级界面，又称全屏界面，给玩家带来强烈的视觉效果，以及代入感 ，它的特点是：全屏场景，UI控件散布在场景中，侧重点是描绘世界观的场景和角色，营造强烈的代入感
                - figure [ref=f17e204]
                - paragraph [ref=f17e207]: 这个也是全屏界面的一种，它的特点是 有框体结构，侧重点是以功能为主的信息的归类和排布，背景为一张静态图片，（如果想要增加细节，可以增加一些动态的流光）
                - figure [ref=f17e208]
                - paragraph [ref=f17e211]: 3.二级界面
                - paragraph [ref=f17e212]: 二级界面，又称弹窗界面，所有的信息和控件都放在一个界面底板内，黑色的遮罩会透出下面的场景/界面，所以玩家在打开界面的同时，仍然可以关注下面场景/界面的信息,不会打断玩家的游戏体验
                - figure [ref=f17e213]
                - paragraph [ref=f17e216]: 4.三级界面
                - paragraph [ref=f17e217]:
                  - text: 三级界面，又称二次确认界面，是弹窗界面的一种，不过占屏幕空间更小，属于交互里面的
                  - link "防错机制" [ref=f17e219] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=3&q=%E9%98%B2%E9%94%99%E6%9C%BA%E5%88%B6&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLpmLLplJnmnLrliLYiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MywiemRfdG9rZW4iOm51bGx9.oMLMzCy5OQCXfaodx6gFYN3vex8gk7p3_0CDEpdwiT8&zhida_source=entity
                  - text: ，以防玩家误操作，造成严重的后果，或者作为给玩家的反馈，引导玩家进行操作
                - figure [ref=f17e222]
                - paragraph [ref=f17e225]: 5.示意图
                - paragraph
                - figure [ref=f17e226]
                - paragraph
                - paragraph [ref=f17e230]: 6.活动界面
                - paragraph [ref=f17e231]: 属于运营活动界面，介于活动的目的、主题繁多，形式也会各有不同，但是鉴于是引导玩家活跃和消费，所以界面的设计也会相对华丽，趣味性也更强，可以脱离制定的界面风格做设计
                - paragraph
                - figure [ref=f17e232]
                - paragraph
                - paragraph [ref=f17e236]: 7.核心玩法界面
                - paragraph [ref=f17e237]: 不同的类型的游戏，核心玩法是完全不一样的哦，不过跟游戏的UI风格保持一致就好
                - figure [ref=f17e238]
                - paragraph [ref=f17e241]: 是不是看完之后，觉得这么多类型的界面真是让人头秃，其实作为新人，你只要做一级、二级以及三级界面，因为主界面和玩法界面属于很重要的系统，所以基本都是由主UI设计的，而且主UI设计好风格和UI的控件，你只需要拿着原型图和UI控件，把界面拼出来就好
                - figure [ref=f17e242]
                - paragraph [ref=f17e245]:
                  - generic [ref=f17e246]:
                    - text: "8."
                    - link "原型图" [ref=f17e248] [cursor=pointer]:
                      - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=2&q=%E5%8E%9F%E5%9E%8B%E5%9B%BE&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLljp_lnovlm74iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MiwiemRfdG9rZW4iOm51bGx9.P3i0OkMFWDzWyaDsUqssrcbjIndVZZsCES0MGN6aVGM&zhida_source=entity
                    - text: （通常由UE/策划出）
                - figure [ref=f17e251]
                - paragraph [ref=f17e254]: 9.UI控件
                - figure [ref=f17e255]
                - paragraph [ref=f17e258]:
                  - text: （温馨提示：并不是所有的
                  - link "控件" [ref=f17e260] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=6&q=%E6%8E%A7%E4%BB%B6&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLmjqfku7YiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6NiwiemRfdG9rZW4iOm51bGx9.XHMv6322RrZCbEh6Jmwi3p9AaP49l_lKhMP-lWcU2F4&zhida_source=entity
                  - text: 都设计好的，只是主UI设计好控件的风格，你需要根据已有的风格做设计延续，如果单纯的拼图，那就不是设计师了）
                - paragraph [ref=f17e263]: 说完界面啦，那我们继续来说说图标吧
                - heading "part4：游戏图标" [level=2] [ref=f17e264]
                - paragraph [ref=f17e265]: 图标的话， 有功能图标、道具图标、技能图标、头像图标、启动图标、徽章.....
                - figure "（图标的绘制过程）" [ref=f17e266]
                - paragraph [ref=f17e270]: 功能图标：各个系统的功能入口，通常是由负责这个系统的设计师画
                - paragraph [ref=f17e271]: 装备/道具图标、技能图标、徽章：这些图标通常数量都是几十上百个的，至于谁做嘛，这得聊聊公司结构了
                - heading "part5：求职方向" [level=2] [ref=f17e272]
                - paragraph [ref=f17e273]:
                  - text: 一个UI设计师，通常求职有两个方向，一个是开发游戏的研发公司，又称为甲方，一个是接研发公司单子的外包公司，又称乙方，如果你入职的是
                  - link "外包公司" [ref=f17e275] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=2&q=%E5%A4%96%E5%8C%85%E5%85%AC%E5%8F%B8&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLlpJbljIXlhazlj7giLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MiwiemRfdG9rZW4iOm51bGx9.P_ciIn-vUUTjRM_z7X1B5PWkswEfL2EE1j-uCmXuneI&zhida_source=entity
                  - text: ，那么作为新人的你，肯定是你画了，你需要画来自不同公司，不同风格的图标和界面
                - paragraph [ref=f17e278]: 如果你如果入职的是研发公司，有三种情况：
                - paragraph [ref=f17e279]:
                  - text: ①所有美术在一起的部门，称之为
                  - link "美术中心" [ref=f17e281] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=1&q=%E7%BE%8E%E6%9C%AF%E4%B8%AD%E5%BF%83&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLnvo7mnK_kuK3lv4MiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.MXgmVYeWdwGF6C6nbpjnsdAlkuBH6DnQJ2f22SPBScE&zhida_source=entity
                  - text: ，需要设计公司内部所有项目组的美术资源，你需要画同公司不同项目中，不同风格的图标和界面
                - paragraph [ref=f17e284]: ②一个项目组有多个UI设计师，代表美术资源内部消化，你需要画自己项目组的的图标和界面
                - paragraph [ref=f17e285]: ③一个项目组有1-2个UI设计师，通常会把这些量大的图标发给外包公司做，你会以做界面为主，偶尔画画图标
                - paragraph [ref=f17e286]: 当你设计好界面和图标的时候，你需要把他们整合成资源，给程序，才能在游戏里面实现你所设计的界面
                - heading "part6：输出规范的出图文件（切图）" [level=2] [ref=f17e287]
                - paragraph [ref=f17e288]: 1、切图规则一：主要是分可切九宫格和不可以切九宫格的资源
                - paragraph [ref=f17e289]: ①可切九宫格资源
                - figure "（切图前）" [ref=f17e290]
                - figure "（切图中）" [ref=f17e294]
                - figure "（得到UI资源，并上传到SVN给程序）" [ref=f17e298]
                - paragraph [ref=f17e302]: 因为左右两边有花纹，如果切掉，再由程序拉伸是无法还原原本的造型的，所以九宫格删掉的，是可以拉伸且能还原原本资源的方法
                - paragraph [ref=f17e303]: ②不可切九宫格资源：像图标这种，直接出图PNG格式就好
                - figure [ref=f17e304]
                - paragraph [ref=f17e307]:
                  - generic [ref=f17e308]:
                    - text: 为什么要把图进行
                    - link "九宫格切图" [ref=f17e310] [cursor=pointer]:
                      - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=1&q=%E4%B9%9D%E5%AE%AB%E6%A0%BC%E5%88%87%E5%9B%BE&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLkuZ3lrqvmoLzliIflm74iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.3mLrthpYLJlDHmXuKtG3sMo53NbdbrVLkgiBKB2x630&zhida_source=entity
                    - text: 呢？
                - paragraph [ref=f17e313]: 因为一个游戏资源会有很多，九宫格切图能够让资源的大小变小，让整个包体需要下载的量小一点，而且方便程序随时调动资源，重复使用
                - paragraph [ref=f17e314]: 2、切图规则二：主要分变化资源和不变化资源
                - paragraph [ref=f17e315]: 例如：如图所示，这是一个剧情对话界面，这里角色、角色名字、剧情文字都是变化资源，因为你会和不同的角色产生不同的对话。
                - paragraph [ref=f17e316]: 所以出图的时候就需要：
                - paragraph [ref=f17e317]: ①所有角色的半身像都切出来（因为你要与不同的角色对话）
                - paragraph [ref=f17e318]: ②文字不需要出，可由程序编写
                - paragraph [ref=f17e319]: ③对话框的底板是属于不变资源，直接用九宫格输出即可
                - figure [ref=f17e320]
                - paragraph [ref=f17e323]: 3、总结
                - paragraph [ref=f17e324]: ①九宫格切图：删掉的部分，可通过拉伸且能还原成的原本资源
                - paragraph [ref=f17e325]: ②变化资源：需要输出一整套需要变化的资源，
                - paragraph [ref=f17e326]:
                  - text: ③不变资源：如果能够九宫格切图就切
                  - link "九宫" [ref=f17e328] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=11&q=%E4%B9%9D%E5%AE%AB&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLkuZ3lrqsiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MTEsInpkX3Rva2VuIjpudWxsfQ.0-VTS3MCYKJv32BlxZiVku8WTnAABkjicymUs5GjcWU&zhida_source=entity
                  - text: ，不能就直接输出
                - paragraph [ref=f17e331]: ④普通文字效果：普通的文字效果，程序可以实现，不需要输出（程序可实现效果：不同颜色的文字，加描边/投影/渐变等效果）
                - paragraph [ref=f17e332]:
                  - text: ⑤美术文字效果：
                  - link "美术效果" [ref=f17e334] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=1&q=%E7%BE%8E%E6%9C%AF%E6%95%88%E6%9E%9C&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLnvo7mnK_mlYjmnpwiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.TS11Rh4aDfPRqIDgXS50dTwlYyUaj4GAH5D2hyWxKzU&zhida_source=entity
                  - text: 的文字，程序是无法实现的，所以需要出图的
                - paragraph [ref=f17e337]: 例如：
                - figure [ref=f17e338]
                - paragraph [ref=f17e341]:
                  - generic [ref=f17e342]: 所以新人入行要学会：①UI界面的风格延续和设计 ②图标设计 ③资源出图
                - paragraph [ref=f17e343]: 这些就是UI的基础工作啦，至于你是否想要入行，我的建议是：想想自己是否热爱游戏，平时是否有玩游戏的习惯，是否有对游戏研发热爱和想要探索的好奇，如果没有，甚至平时不玩游戏，单纯想搞钱，建议还是算了，不要盯着工资高、热门之类的，任何行业/职业，收益和付出、收益和要求，都是对应的，高薪取决于你的能力，而能力的形成靠的是平时对游戏的热爱和刻意练习去提升的
                - figure [ref=f17e344]
                - paragraph [ref=f17e347]: 扯皮完啦，如果你真心想要入行，那么接着往下看吧
                - heading "part7：如何入行游戏UI" [level=2] [ref=f17e348]
                - paragraph [ref=f17e349]:
                  - text: 上次在群里聊天，特意问了问群友当初是怎么入行的，原来很多都是由游戏的其他职位转过来的，例如：
                  - link "原画设计师" [ref=f17e351] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=1&q=%E5%8E%9F%E7%94%BB%E8%AE%BE%E8%AE%A1%E5%B8%88&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLljp_nlLvorr7orqHluIgiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.FuHWlsQLGbupwgUPnqj6vX7nJvZCoY6mzAgxE19Adxo&zhida_source=entity
                  - text: 转UI
                  - link "设计师" [ref=f17e355] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=9&q=%E8%AE%BE%E8%AE%A1%E5%B8%88&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLorr7orqHluIgiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6OSwiemRfdG9rZW4iOm51bGx9.1_elqPra6L2mlLYTSEMwayAtb4NHnZW5Ro0XUL2U_qs&zhida_source=entity
                  - text: ，据说是因为游戏UI在端游时代不受重视，随便找个美术就做了，后来手游爆发迎来了一波红利期，所以很多公司都开始研发手游，但是手游屏幕小，内容展示的方式和操作的方式变了，端游那套放到手游里面行不通，美术资源会变糊，看不清，而且交互方式也不适用，交互有问题，就会造成用户流失，对游戏本身的影响巨大，造成这个职位人才需求量巨大，所以那时候有很多业内人员自愿/被迫的变成了游戏UI
                - paragraph [ref=f17e358]: 至于关于如何入行，无非就是自学或者报培训班
                - paragraph [ref=f17e359]: 1、自学
                - paragraph [ref=f17e360]: ①需要有一定的美术基础，最好是美术专业毕业的，不然连软件操作都困难，谈何自学
                - paragraph [ref=f17e361]: ②需要极强的自控力和自我驱动能力，因为学习的时间，进度，难度都由自己把控
                - paragraph [ref=f17e362]: ③需要对游戏UI有一定的认识，不然很容易走弯路，事倍功半
                - paragraph [ref=f17e363]: 2、UI培训班
                - paragraph [ref=f17e364]: UI设计培训班，一般分了二种，一种为线下一种为线上
                - list [ref=f17e365]:
                  - listitem [ref=f17e366]: • 线上的为网络班：价格大概在几千不等，学几个月，一周几节课这样，价格相对便宜，适合有一定基础并且有一定自控力的人学，而且不限制地方，你那里都可以学，就算赶不上上课时间，课后也会提供视频录制，也就更方便了边上班边学习的人
                  - listitem [ref=f17e367]: • 线下的为实体班：价格大概在1-2万不等，也是学几个月，不过是全天上课，适合不工作不上学，经济条件不错，没有基础的人去学，但是会有地域限制，需要去那个城市去培训，且不包吃住
                - paragraph [ref=f17e368]: 首先，我没有卖广告哦，也不会帮忙推荐哪家培训班，至于为什么说入行的方式主要是培训班呢，因为自学门槛比较高，首先我是自学入行的，当初学的也不怎么样，只是刚好那时候赶上红利期，对UI的需求量比较大，也就成功入行了，现在手游已经越来越趋向精品化了，如果作品不够硬，很难入行的，报班的话，跟着老师的课程会学的比较系统的知识体系，同时避免了因为自觉性不够半途而废，遇到问题也可以及时请教老师，避免走弯路，课后做作业也有老师的点评，即达到了刻意练习也知道了为什么这么设计。
                - paragraph [ref=f17e369]: 但是市面上很多培训班，宣传声势浩大，教学质量却不怎么样，为了避免大家踩坑，给大家说几条避避坑吧
                - paragraph [ref=f17e370]: 3、避坑指南
                - paragraph [ref=f17e371]: ①不要单纯看学生作品哦，要看老师作品怎么样，参与过什么项目，因为有些老师脱离游戏研发久了，会形成一些问题：例如教导的风格已经跟不上现在流行的风格了，这样导致他教的知识不适用于现在的游戏研发，同时因为不是流行的风格，到时候你就算有作品了，找工作入行也会相对困难
                - paragraph [ref=f17e372]:
                  - text: ②不要过高期待，觉得学生作品这么好看，到时候我也能画的这么好看，能，但是也是少数人，首先是自律，需要不停的做刻意练习，这里就刷下一批人了，其次那些非常好看的作品，代表这个学生基础非常好，只是缺乏些
                  - link "设计思维" [ref=f17e374] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=1&q=%E8%AE%BE%E8%AE%A1%E6%80%9D%E7%BB%B4&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLorr7orqHmgJ3nu7QiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.w5MGldBZFNyty95nNI7zfnmE4HSGEk-xbgDtxz4UizI&zhida_source=entity
                  - text: ，老师只是加以引导，如果完全没有基础，几个月之后算是学完基础吧
                - paragraph [ref=f17e377]:
                  - text: ③不仅要好看还要实用，这个大概需要入行一段时间才看得出来吧，因为很多培训老师为了让学生的作品好看，会特别强调美术华丽这一块，让你觉得学完物有所值，但是这样往往让交互不太合理（也就是实用性不强）而面试官都是身经百战的，一眼就看出来了，这也是很多面试官不愿意收培训班简历的原因，我的建议是：你在做
                  - link "虚拟项目" [ref=f17e379] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=160124539&content_type=Article&match_order=1&q=%E8%99%9A%E6%8B%9F%E9%A1%B9%E7%9B%AE&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMjMsInEiOiLomZrmi5_pobnnm64iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjAxMjQ1MzksImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.zhE48Ak7ohMgaYrbqk9h6Kn7PwvOmJc5a4PSjeiRb6M&zhida_source=entity
                  - text: 的时候，可以参考真实项目的交互，不要东拼西凑内容
                - paragraph [ref=f17e382]: ④通常培训老师帮你批改作业的时候，都会写怎么怎么修改，你不妨问问为什么这么修改，设计的思路是怎么样的，当你知道设计核心之后，你会产生新的设计方法
                - paragraph [ref=f17e383]: 温馨提示：有些老师会帮学生做作品的，千万不要哦，因为这一行入职要做测试题的，也就是说就算你的作品如何好看，到时候做测试题的时候如果实力不够就会暴露咯
                - figure [ref=f17e384]
                - paragraph [ref=f17e387]: 你看完啦，预祝你入行成功，说不定以后我们就是同事了，加油！
                - paragraph [ref=f17e388]: 觉得不错，有所收获的，给我点个赞吧
                - paragraph [ref=f17e389]: (如果你有不一样的观点，欢迎来交流哦 )
