                - paragraph [ref=f17e130]: 可以的哦，因为很多设计师都是来自各行各业的，所以这个问题不大，不过就是会相比比较劣势，面试的时候，面试官会看你是否美术专业出身的，因为这代表你的基础相对比较扎实，如果没有任何基础的话，就需要重新学习这些基础知识了，特别是游戏这一块，相对比较看重手绘能力，所以就看你有没有这个决心，把这块短板给补上，比美术专业的人付出更多的时间和精力进行刻意练习。
