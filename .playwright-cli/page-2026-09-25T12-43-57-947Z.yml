        - generic [ref=f1e75]:
          - paragraph [ref=f1e76]: 第一步；基础万丈高楼平地起，基础是游戏原画学习的基础也是基石。对零基础的来说要先学习PS的使用、手绘板的使用和简单的素描、石膏、阴影
          - figure [ref=f1e77]
          - paragraph [ref=f1e79]: 很多人提到自学。简单说明一下：自学画画的人，大多结局是这几种：1、自学时间短，水平只能自娱自乐 2、自学时间长，5年以上，水平只能自娱自乐 3、自学时间长，5年以上，可以画一点有个人风格的东西，以此赚钱，但缺乏基本功练习，局限性很大。 4、极其少数自学成才成为大师者，万分之一不到吧。而且这类人往往早早就发现自己的天赋，不会因为工作原因才想起来要学这个糊口。
          - paragraph [ref=f1e80]: 而这里的体系指的是学习体系，游戏原画每一部分之间都是有紧密联系的，例如要想学会场景，那你要先学习阴影、线条、人物......
          - figure [ref=f1e81]
          - paragraph [ref=f1e83]: 第四步:基础学习得差不多了，就要开始练习，从模仿开始，一定要努力的模仿、练习，不断的总结和对比自己的技能和模板间的差距，并且不断的将疑问去找老师及时的弄明白，慢慢的技能和感觉就都出来了。
          - paragraph [ref=f1e84]: 第五步：再进一步就是要开始树立自己的画风和对游戏的理解，这点上很多人不理解，其实就和服装、插画等艺术的定位是一样的，什么样的游戏搭配什么样的画风，你把一个射击游戏设计得和古典言情游戏画风一样肯定是不宜的。
          - paragraph [ref=f1e85]:
            - text: 点击链接加入：
            - link "很多初学者，对游戏原画的概念都是模糊不清的，游戏原画是什么，能做什么，学游戏原画有什么优势，该按照什么线路去学习，学完往哪方面发展，想深入了解，想学习的同学请加Q群，内有有大量实战学习资料（零基础以及进阶的经典实战）分享给大家，并且有资深讲师给大家免费授课，给大家分享目前国内最完整的原画高端实战实用学习流程体系，让你少走弯路。" [ref=f1e86] [cursor=pointer]:
              - /url: https://link.zhihu.com/?target=https%3A//jq.qq.com/%3F_wv%3D1027%26k%3DNpFF6Wes
          - paragraph [ref=f1e87]
          - paragraph [ref=f1e88]
          - paragraph [ref=f1e89]
          - paragraph [ref=f1e90]: 1、游戏人物原画设计人体结构要准确。
          - paragraph [ref=f1e91]: 人体结构是必须画好的，要从立体构成和平面构成上找到美感，并把握骨骼的脉络。部分原画师人体结构都没画好，整个角色看起来没有骨头，肢体表现也不平衡，软绵绵的十分怪异。
          - paragraph [ref=f1e92]: 2、游戏人物原画设计服装设计要点。
          - paragraph [ref=f1e93]: 角色服装的设计必须与世界观元素相贴合，从文化层面进行扣题，同时要为后期建模人员考虑，服装和身体之间的连接不能太复杂，否则不利于建模工作。
          - paragraph [ref=f1e94]
          - figure [ref=f1e95]
          - paragraph [ref=f1e97]
          - paragraph [ref=f1e98]: 3、游戏人物原画设计配色要讲究。
          - paragraph [ref=f1e99]: 配色是游戏原画角色设计中很重要的一环，色彩的分布是否平衡？如何用颜色表达出文化内涵和意境主题？不少的国内游戏原画设计师设计能力不过关，习惯于从别人那里搬运，自己并不懂得设计元素的文化内涵，结果画出来的作品没有灵魂。
          - paragraph [ref=f1e100]: 4、游戏人物原画设计的职业设计。
          - paragraph [ref=f1e101]: 游戏原画师进行角色职业设计的时候，要知道如何突出角色的职业定位。要让角色的建模直接传达给别人职业的信息，比如力量战士的体型要魁梧、突出肌肉和力量感，发型不能配柔性长发，而是要板寸头之类发型以突出粗狂的性格。这些都是职业设计的时候要注意的地方。
          - paragraph [ref=f1e102]
          - figure [ref=f1e103]
          - paragraph [ref=f1e105]
          - paragraph [ref=f1e106]: 说到游戏人物设计，前段时间著名游戏公司暴雪，发布了《守望先锋2》的相关内容，并放出了一些人物的美术改动效果图。引起不少粉丝的讨论，对于新一代的改动意见各不相同，那么不妨我们今天就来从专业的角度来看看，这次游守望先锋2的改动到底如何呢？这里也推荐大家看看这个过于游戏人物设计的构成：设计参考 | 人物角色该如何设计？
          - paragraph [ref=f1e107]: 小编今天就来跟大家聊一聊一些个人见解～我挑了几组，先看看1、2代的对比：
          - paragraph [ref=f1e108]
          - paragraph [ref=f1e109]
          - figure [ref=f1e110]
          - paragraph [ref=f1e112]
          - paragraph [ref=f1e113]: 猎空：
          - paragraph [ref=f1e114]: 猎空在这次的改动中除了身上装备搭配、材质以为，变动比较明显的一个。其中从设计的角度来说，主要就是人物剪影的变化。
          - paragraph [ref=f1e115]: 剪影形的节奏、辨识度等等对一个好的角色是很重要的。这次2代上半身的剪影形变小了，上下半身的对比也就减弱了，也一定程度猎空外向的性格张力变弱来一些。另外最让粉丝不接受的就是她标志性的大长腿变粗了！辨识度也所减弱，整体的感觉也比前一代少了一些轻盈的感觉。
          - paragraph [ref=f1e116]
          - figure [ref=f1e117]
          - paragraph [ref=f1e119]
          - paragraph [ref=f1e120]: 再来看区块的切割。个人觉得，1代虽然剪影形更好，不过也是因为手臂部分比较大，但是与胸前的装备之间的主次区分就不明确了。所以2代也是简化了手臂部分，为次，也加强了胸前的装备整体感跟层次感来突出。
          - paragraph [ref=f1e121]: 而且原本1代的防风镜的白色边框比较粗，颜色也比较突出，反而对人物的脸有点分割跟遮挡，2代就让脸部看起来更完整。整体质感上2代也更有未来感。但是1代胯部位置的3个切割线是更好的，也是有帮助凸显腿长的效果。
          - paragraph [ref=f1e122]
          - figure [ref=f1e123]
          - paragraph [ref=f1e125]
          - paragraph [ref=f1e126]: 最后看一下颜色跟小细节元素的分布。原本的上半身与橙黄色的呼应只有一个防风镜，而2代在小细节元素上也加入了更多颜色的呼应。并且1代的细节元素分布比较散，2代也更加集中。但是2代颜色上黄色减少，也让活泼阳光的性格少了很多。所以从设计角度上来说，2代整体优化了一些，但是可能粉丝们不接受的也就是角色性格特点方面不如之前了吧，或者说有点不习惯。
          - paragraph [ref=f1e127]: 源氏：
          - paragraph [ref=f1e128]: 源氏作为守望里也十分有人气的角色，1代的设计其实是十分成功的。而2代的改动，比如换上了潮服，是削弱1代冰冷的机械感，增强了作为人类的观感，也是有所拉近角色与玩家的距离。
          - paragraph [ref=f1e129]: 但潮服搭佩的头部依然是不漏脸的金属武士，再仿佛穿上一双足球鞋，这样就让不少玩家接受不能了。而且原本1代的机甲与肌肉切割结合的效果很好，潮服导致这种切割美感变弱了不少，裤子也显得过于简单。
          - paragraph [ref=f1e130]
          - figure [ref=f1e131]
          - paragraph [ref=f1e133]
          - paragraph [ref=f1e134]: 但整体上密下疏的节奏是可以的，觉得裤子太空、缺少科技感，所以我尝试简单增加了一点机甲的部分。
          - paragraph [ref=f1e135]
          - figure [ref=f1e136]
          - paragraph [ref=f1e138]
          - paragraph [ref=f1e139]: 小美：
          - paragraph [ref=f1e140]: 小美的改动在我看来是改的比较好的。作为设定上的中国妹子，在国内同人画圈里也人气不小。虽然她身材比较饱满，但作为女生也是爱美的。这次2代减少了很多棉袄的绒毛部分，并且颈部也只保留了后半截。这样会让她看上去没有那么臃肿，颈部前半截露出来也不会像1代感觉包的太紧。
          - paragraph [ref=f1e141]: 手脚的机甲设计虽然稍微有点缺乏个性，也是更加表现了防御感，但在脚的部分也多了一分笨重感。另外对比之下，2代正面简洁很多，1代则小元素多而且碎了一点。
          - paragraph [ref=f1e142]
          - figure [ref=f1e143]
          - paragraph [ref=f1e145]
          - paragraph [ref=f1e146]: 再来看切割。原本就身材饱满的小美，还被1代用了很多横向的切割，胖过的人都知道不会穿横条衫。2代则加入了更多纵向的切割，并且是带有一定收窄角度的，还有脚部这样的弧形切割都是很好的缓解了臃肿的感觉。
          - paragraph [ref=f1e147]
          - paragraph [ref=f1e148]
          - paragraph [ref=f1e149]: 大区块的分割上，1代也是节奏变化不够，2代在疏密关系、切割大小上也更加合理。再仔细看，还可以看到小美的脸部特征跟肤色刻画也更加还原我们亚洲黄种人的。
          - paragraph [ref=f1e150]
          - figure [ref=f1e151]
          - paragraph [ref=f1e153]
          - paragraph [ref=f1e154]: 天使：
          - paragraph [ref=f1e155]: 天使的改动则也是褒贬不一了，不过对于玩家来说主要还是头部的改动比较难以接受。高挑的马尾辫以及刘海的改动，让2代的形象特点减弱了不少，也少了那份御姐的气质。但从设计的其他角度来说，形状切割更加丰富，提升了层次效果。但在背后的翅膀以及大腿的3片羽翼，重复内容的排列上，2代小节奏变化更少，稍微显得呆板了一点点。
          - paragraph [ref=f1e156]
          - figure [ref=f1e157]
          - paragraph [ref=f1e159]
          - paragraph [ref=f1e160]: 由于切割层层变多，颜色的层次也更加丰富，黄色变多，色调更加明亮。
          - paragraph [ref=f1e161]
          - figure [ref=f1e162]
          - paragraph [ref=f1e164]
          - paragraph [ref=f1e165]: 另外，守望先锋角色设计的特点就是很善于运用基础的几何形元素。比如天使运用了很多三角形，而小美则用了很多方形，不同的几何形也能很好的体现不同的角色性格。
          - paragraph [ref=f1e166]
          - figure [ref=f1e167]
          - paragraph
