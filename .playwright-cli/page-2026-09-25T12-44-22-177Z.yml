              - generic [ref=f5e87]:
                - paragraph [ref=f5e88]:
                  - text: 现在
                  - link "次世代游戏" [ref=f5e90] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E6%AC%A1%E4%B8%96%E4%BB%A3%E6%B8%B8%E6%88%8F&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLmrKHkuJbku6PmuLjmiI8iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.as6P9Dir62bhOLMS6NycTfSaTD6oforuLO8jAzkNW3Q&zhida_source=entity
                  - text: 建模拥有很多其他职业无法比拟的闪光点，越来越多的人开始学习建模，提升自己的竞争力，那对于小白来说，第一步应该学习什么呢？
                - paragraph [ref=f5e93]: 从事次世代建模行业已经有好几年了，对于这个问题也来表达一下自己的真知灼见，希望对你有用！
                - figure [ref=f5e94]
                - paragraph [ref=f5e97]: 次世代3D建模主要从以下三个方面学：
                - paragraph [ref=f5e98]: No.1软件的熟练度
                - paragraph [ref=f5e99]: 一个精致的模型不可能只用到某一个软件，共同协作才能达到想要的效果，所以，很多软件都需要了解，但是精通的话，一个就行。
                - paragraph [ref=f5e100]: 目前次世代的主流软件就是雕刻高模的ZBrush，可以从这个软件开始。
                - paragraph [ref=f5e101]: No.2美术基础
                - paragraph [ref=f5e102]:
                  - text: 次世代建模中所说的美术基础，并不是意义上素描、速写，而是
                  - generic [ref=f5e103]:
                    - text: 一个造型能力和
                    - link "色彩基础" [ref=f5e105] [cursor=pointer]:
                      - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E8%89%B2%E5%BD%A9%E5%9F%BA%E7%A1%80&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLoibLlvanln7rnoYAiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.s_sIcH8zfd-N6ZU5k526PtAQaslG3DsdKV4dSV8tWmY&zhida_source=entity
                    - text: 的统称。
                - paragraph [ref=f5e108]: 所以，我们在平时的生活中要培养我们的造型能力、审美能力、要会设计和品位。软件的熟练度决定了你的下限，而你的审美造型能力，决定了你的上限。如果想要以后走得更远，薪资更高，就扎实一下自己的美术基础。
                - paragraph [ref=f5e109]: No.3必要的行业规范
                - paragraph [ref=f5e110]: 只有做过资深建模师的才知道，一个项目完整的流程在行业里具体的要求，否则即使你的作品很美，但无法放进引擎里，也是徒然。
                - paragraph [ref=f5e111]: 前面两者只要花时间自学也都能解决，而后面这个比较推荐报班或者找大佬，且硬件在升级，项目要求也时刻有变化，找有在一线的公司工作过，做过项目经验的最为靠谱。
                - paragraph [ref=f5e112]: 我当时确实在进行学习的时候就特意找了一个大佬，请教他这方面的问题，大佬了解我确实是对这行很着迷，也是毫无保留的为了解答，大佬的联系方式放着了，自取。
                - paragraph [ref=f5e113]: 掌握了以上3个方面就可以开始接触次世代游戏建模啦，我也把流程给大家写出来了，看看是不是能够看得懂，看不懂的可以在私信和评论区留言，我会在第一时间回复的。
                - list [ref=f5e114]:
                  - listitem [ref=f5e115]: • 流程一：构思
                - paragraph [ref=f5e116]: 你要做什么模型，确定好要做的模型就可以进行下一步了！
                - list [ref=f5e117]:
                  - listitem [ref=f5e118]: • 流程二：建低模
                - paragraph [ref=f5e119]:
                  - text: 3Dmax/Maya建低模，准确的说叫
                  - link "低模手绘" [ref=f5e121] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E4%BD%8E%E6%A8%A1%E6%89%8B%E7%BB%98&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLkvY7mqKHmiYvnu5giLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.3t848n6CslI7Aq_9h79cOv3hNCa_MS3PvZAECsysnQQ&zhida_source=entity
                  - text: ，分为
                  - link "3D角色" [ref=f5e125] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=3D%E8%A7%92%E8%89%B2&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiIzROinkuiJsiIsInpoaWRhX3NvdXJjZSI6ImVudGl0eSIsImNvbnRlbnRfaWQiOjE2OTY1OTQyMiwiY29udGVudF90eXBlIjoiQXJ0aWNsZSIsIm1hdGNoX29yZGVyIjoxLCJ6ZF90b2tlbiI6bnVsbH0.uLoEWcfwM39sjXIFL-o7jFGVEzUsVaN-XipHnShXgiY&zhida_source=entity
                  - text: /3D场景，简单说就是3D建模师根据原画，通过3D制作还原3D造型，因为制作模型面数较低，主要靠
                  - link "手绘贴图" [ref=f5e129] [cursor=pointer]:
