                  - text: 达到最终效果。
                - figure [ref=f5e132]
                - list [ref=f5e135]:
                  - listitem [ref=f5e136]:
                    - text: •
                    - generic [ref=f5e137]:
                      - text: 流程三：3Dmax/
                      - link "maya" [ref=f5e139] [cursor=pointer]:
                        - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=maya&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiJtYXlhIiwiemhpZGFfc291cmNlIjoiZW50aXR5IiwiY29udGVudF9pZCI6MTY5NjU5NDIyLCJjb250ZW50X3R5cGUiOiJBcnRpY2xlIiwibWF0Y2hfb3JkZXIiOjEsInpkX3Rva2VuIjpudWxsfQ.u0-PyAZUUtbELFTCnRgVoKBHN4-gjHICc_EdgDBeM3U&zhida_source=entity
                      - text: 建中模
                - paragraph [ref=f5e142]: 中模不是严格的概念，攻守兼备。上可改高模，下可变低模。次世代的精华也就在高模的制作，当然低模和其它流程也很重要
                - list [ref=f5e143]:
                  - listitem [ref=f5e144]: • 流程四：进行高模的雕刻和细节的制作
                - paragraph [ref=f5e145]:
                  - text: 高模细节多，面数高，游戏引擎拖不动，从而产生拓补低模的概念，低模完全符合引擎要求和布线规则。而此时的
                  - link "高模" [ref=f5e147] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=6&q=%E9%AB%98%E6%A8%A1&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLpq5jmqKEiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6NiwiemRfdG9rZW4iOm51bGx9.YKrsVRaOaeGKYwy_GkAXchCXRRmsUknWlPZTTsMG7Lk&zhida_source=entity
                  - text: 作用是为了把高模的细节投射到低模上达到更加极致的效果又能在引擎中运行。
                - list [ref=f5e150]:
                  - listitem [ref=f5e151]:
                    - text: •
                    - generic [ref=f5e152]:
                      - text: 流程五：将做好的
                      - link "高模拓扑" [ref=f5e154] [cursor=pointer]:
                        - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E9%AB%98%E6%A8%A1%E6%8B%93%E6%89%91&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLpq5jmqKHmi5PmiZEiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.tLFZZP5VrNjFwRKw6eXoI4fTzg9fEFrMZ94nKHO-hW0&zhida_source=entity
                      - text: 成低模
                - paragraph [ref=f5e157]:
                  - text: 在ZBrush中
                  - link "拓扑低模" [ref=f5e159] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E6%8B%93%E6%89%91%E4%BD%8E%E6%A8%A1&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLmi5PmiZHkvY7mqKEiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.SaVZDANrHmqLqBbN1LkPZScPQFd-tqq7UqhtrciHeDk&zhida_source=entity
                  - text: ，拓扑低模的目的是需要得到一个正确布线，并且可以在项目中使用的模型。
                - paragraph [ref=f5e162]:
                  - text: 我们之前雕刻的高精度模型，在项目中来说
                  - link "面数" [ref=f5e164] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=3&q=%E9%9D%A2%E6%95%B0&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLpnaLmlbAiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MywiemRfdG9rZW4iOm51bGx9.I4YUdw-rMDZG2rMJQWxuDSUb4Fu9ElcvcQ5mxR-rdnw&zhida_source=entity
                  - text: 太高了，尤其是将模型放到其他
                  - link "三维软件" [ref=f5e168] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E4%B8%89%E7%BB%B4%E8%BD%AF%E4%BB%B6&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLkuInnu7Tova_ku7YiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.Gp_XVyDF-x3eXBTbYQksD_uKwAui9FYJ5bL2tTpHYoM&zhida_source=entity
                  - text: 中，几乎是无法继续接下来的工作的。所以，需要拓扑一个低精度的模型，然后使用贴图把高精度模型的细节显示在低精度模型上。
                - list [ref=f5e171]:
                  - listitem [ref=f5e172]: • 流程六：UV拆分
                - paragraph [ref=f5e173]:
                  - link "拆UV" [ref=f5e175] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E6%8B%86UV&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLmi4ZVViIsInpoaWRhX3NvdXJjZSI6ImVudGl0eSIsImNvbnRlbnRfaWQiOjE2OTY1OTQyMiwiY29udGVudF90eXBlIjoiQXJ0aWNsZSIsIm1hdGNoX29yZGVyIjoxLCJ6ZF90b2tlbiI6bnVsbH0.qLlHWlAbYiBbfrg3mMcVvuxDKu3wQJQGgNPPvhH-ckI&zhida_source=entity
