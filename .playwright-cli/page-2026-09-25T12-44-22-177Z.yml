                - figure [ref=f5e179]
                - list [ref=f5e182]:
                  - listitem [ref=f5e183]: • 流程七：烘焙
                - paragraph [ref=f5e184]: 烘焙的目的是将物体高模上的法线信息尽可能完好的记录下来。
                - paragraph [ref=f5e185]:
                  - text: 而做好烘焙的三要素为：
                  - generic [ref=f5e186]:
                    - link "平滑组" [ref=f5e188] [cursor=pointer]:
                      - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E5%B9%B3%E6%BB%91%E7%BB%84&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLlubPmu5Hnu4QiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.6NQMHBjAdJjkXcQMdHzhcqqJSZEhW1MIwj2ijKQYaVc&zhida_source=entity
                    - text: ，UV和Cage
                  - text: 。烘焙的过程是将高模的细节
                  - link "信息映射" [ref=f5e192] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E4%BF%A1%E6%81%AF%E6%98%A0%E5%B0%84&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwNTgsInEiOiLkv6Hmga_mmKDlsIQiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.mCd8XHYw3bsSD10ByckZ8orObICHZ4k4TmB9l_M6sk8&zhida_source=entity
