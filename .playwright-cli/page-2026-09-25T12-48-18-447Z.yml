                - generic [ref=f25e78]: 12 人赞同了该文章
              - generic [ref=f25e87]:
                - paragraph [ref=f25e88]:
                  - text: 现在
                  - link "次世代游戏" [ref=f25e90] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E6%AC%A1%E4%B8%96%E4%BB%A3%E6%B8%B8%E6%88%8F&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLmrKHkuJbku6PmuLjmiI8iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.wRFSQHEGR49rE-tmgPG3RrlNi7tDxgDeR68gq6_C-Tk&zhida_source=entity
                  - text: 建模拥有很多其他职业无法比拟的闪光点，越来越多的人开始学习建模，提升自己的竞争力，那对于小白来说，第一步应该学习什么呢？
                - paragraph [ref=f25e93]: 从事次世代建模行业已经有好几年了，对于这个问题也来表达一下自己的真知灼见，希望对你有用！
                - figure [ref=f25e94]
                - paragraph [ref=f25e97]: 次世代3D建模主要从以下三个方面学：
                - paragraph [ref=f25e98]: No.1软件的熟练度
                - paragraph [ref=f25e99]: 一个精致的模型不可能只用到某一个软件，共同协作才能达到想要的效果，所以，很多软件都需要了解，但是精通的话，一个就行。
                - paragraph [ref=f25e100]: 目前次世代的主流软件就是雕刻高模的ZBrush，可以从这个软件开始。
                - paragraph [ref=f25e101]: No.2美术基础
                - paragraph [ref=f25e102]:
                  - text: 次世代建模中所说的美术基础，并不是意义上素描、速写，而是
                  - generic [ref=f25e103]:
                    - text: 一个造型能力和
                    - link "色彩基础" [ref=f25e105] [cursor=pointer]:
                      - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E8%89%B2%E5%BD%A9%E5%9F%BA%E7%A1%80&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLoibLlvanln7rnoYAiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.pVOEuEOPyv6iBwkx2hIkrZuTaNt4DHFDg3y7W8x1Z0M&zhida_source=entity
                    - text: 的统称。
                - paragraph [ref=f25e108]: 所以，我们在平时的生活中要培养我们的造型能力、审美能力、要会设计和品位。软件的熟练度决定了你的下限，而你的审美造型能力，决定了你的上限。如果想要以后走得更远，薪资更高，就扎实一下自己的美术基础。
                - paragraph [ref=f25e109]: No.3必要的行业规范
                - paragraph [ref=f25e110]: 只有做过资深建模师的才知道，一个项目完整的流程在行业里具体的要求，否则即使你的作品很美，但无法放进引擎里，也是徒然。
                - paragraph [ref=f25e111]: 前面两者只要花时间自学也都能解决，而后面这个比较推荐报班或者找大佬，且硬件在升级，项目要求也时刻有变化，找有在一线的公司工作过，做过项目经验的最为靠谱。
                - paragraph [ref=f25e112]: 我当时确实在进行学习的时候就特意找了一个大佬，请教他这方面的问题，大佬了解我确实是对这行很着迷，也是毫无保留的为了解答，大佬的联系方式放着了，自取。
                - paragraph [ref=f25e113]: 掌握了以上3个方面就可以开始接触次世代游戏建模啦，我也把流程给大家写出来了，看看是不是能够看得懂，看不懂的可以在私信和评论区留言，我会在第一时间回复的。
                - list [ref=f25e114]:
                  - listitem [ref=f25e115]: • 流程一：构思
                - paragraph [ref=f25e116]: 你要做什么模型，确定好要做的模型就可以进行下一步了！
                - list [ref=f25e117]:
                  - listitem [ref=f25e118]: • 流程二：建低模
                - paragraph [ref=f25e119]:
                  - text: 3Dmax/Maya建低模，准确的说叫
                  - link "低模手绘" [ref=f25e121] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E4%BD%8E%E6%A8%A1%E6%89%8B%E7%BB%98&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLkvY7mqKHmiYvnu5giLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.Q3KYKoPL_7iIwYXvw4oh95_EKM5D5jmJePfk_g6bMyM&zhida_source=entity
                  - text: ，分为
                  - link "3D角色" [ref=f25e125] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=3D%E8%A7%92%E8%89%B2&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiIzROinkuiJsiIsInpoaWRhX3NvdXJjZSI6ImVudGl0eSIsImNvbnRlbnRfaWQiOjE2OTY1OTQyMiwiY29udGVudF90eXBlIjoiQXJ0aWNsZSIsIm1hdGNoX29yZGVyIjoxLCJ6ZF90b2tlbiI6bnVsbH0.hgLobg0GM0H7TSOms4MTe-C5CoB6iLfvk8mdCmMIMf4&zhida_source=entity
                  - text: /3D场景，简单说就是3D建模师根据原画，通过3D制作还原3D造型，因为制作模型面数较低，主要靠
                  - link "手绘贴图" [ref=f25e129] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E6%89%8B%E7%BB%98%E8%B4%B4%E5%9B%BE&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLmiYvnu5jotLTlm74iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.ZAt5d5_vUEdtbVy20WHVA8p8My59Iw-w-0U80fHsH5g&zhida_source=entity
                  - text: 达到最终效果。
                - figure [ref=f25e132]
                - list [ref=f25e135]:
                  - listitem [ref=f25e136]:
                    - text: •
                    - generic [ref=f25e137]:
                      - text: 流程三：3Dmax/
                      - link "maya" [ref=f25e139] [cursor=pointer]:
                        - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=maya&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiJtYXlhIiwiemhpZGFfc291cmNlIjoiZW50aXR5IiwiY29udGVudF9pZCI6MTY5NjU5NDIyLCJjb250ZW50X3R5cGUiOiJBcnRpY2xlIiwibWF0Y2hfb3JkZXIiOjEsInpkX3Rva2VuIjpudWxsfQ.i-FJeMReuWlqZaH_VwABAjOSPiAyq5u3i4whTEAtxBI&zhida_source=entity
                      - text: 建中模
                - paragraph [ref=f25e142]: 中模不是严格的概念，攻守兼备。上可改高模，下可变低模。次世代的精华也就在高模的制作，当然低模和其它流程也很重要
                - list [ref=f25e143]:
                  - listitem [ref=f25e144]: • 流程四：进行高模的雕刻和细节的制作
                - paragraph [ref=f25e145]:
                  - text: 高模细节多，面数高，游戏引擎拖不动，从而产生拓补低模的概念，低模完全符合引擎要求和布线规则。而此时的
                  - link "高模" [ref=f25e147] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=6&q=%E9%AB%98%E6%A8%A1&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLpq5jmqKEiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6NiwiemRfdG9rZW4iOm51bGx9.XglpcfFr08hZSkjiYDKgmpU3ZEPfV0yy7Jg8DwOW5nk&zhida_source=entity
                  - text: 作用是为了把高模的细节投射到低模上达到更加极致的效果又能在引擎中运行。
                - list [ref=f25e150]:
                  - listitem [ref=f25e151]:
                    - text: •
                    - generic [ref=f25e152]:
                      - text: 流程五：将做好的
                      - link "高模拓扑" [ref=f25e154] [cursor=pointer]:
                        - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E9%AB%98%E6%A8%A1%E6%8B%93%E6%89%91&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLpq5jmqKHmi5PmiZEiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.04v1ttmSfpRtdbl2j9zZ6GhUdRy7SKpMH4I90XJ-lpk&zhida_source=entity
                      - text: 成低模
                - paragraph [ref=f25e157]:
                  - text: 在ZBrush中
                  - link "拓扑低模" [ref=f25e159] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E6%8B%93%E6%89%91%E4%BD%8E%E6%A8%A1&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLmi5PmiZHkvY7mqKEiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.-if_aQQQs0QyeH2BunJcw4n9AoYS79jR6HBlGJh9Syc&zhida_source=entity
                  - text: ，拓扑低模的目的是需要得到一个正确布线，并且可以在项目中使用的模型。
                - paragraph [ref=f25e162]:
                  - text: 我们之前雕刻的高精度模型，在项目中来说
                  - link "面数" [ref=f25e164] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=3&q=%E9%9D%A2%E6%95%B0&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLpnaLmlbAiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MywiemRfdG9rZW4iOm51bGx9.mRZVTJX9QYtbXW0kaRRfJkVJJbFK63qNgw5e8GAwwFQ&zhida_source=entity
                  - text: 太高了，尤其是将模型放到其他
                  - link "三维软件" [ref=f25e168] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E4%B8%89%E7%BB%B4%E8%BD%AF%E4%BB%B6&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLkuInnu7Tova_ku7YiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.4qi5-m5_mstE_k0U_ayo7CgxRmmGDV8hluuHRFvveeU&zhida_source=entity
                  - text: 中，几乎是无法继续接下来的工作的。所以，需要拓扑一个低精度的模型，然后使用贴图把高精度模型的细节显示在低精度模型上。
                - list [ref=f25e171]:
                  - listitem [ref=f25e172]: • 流程六：UV拆分
                - paragraph [ref=f25e173]:
                  - link "拆UV" [ref=f25e175] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E6%8B%86UV&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLmi4ZVViIsInpoaWRhX3NvdXJjZSI6ImVudGl0eSIsImNvbnRlbnRfaWQiOjE2OTY1OTQyMiwiY29udGVudF90eXBlIjoiQXJ0aWNsZSIsIm1hdGNoX29yZGVyIjoxLCJ6ZF90b2tlbiI6bnVsbH0.4VWxAMIekfQTLMyCzZl_bwDit4sFrGKHZpVXPr5DYXw&zhida_source=entity
                  - text: 是方便贴图更好的贴合到3D模型中，并且贴图内容位置对应模型位置搞那更准确。
                - paragraph [ref=f25e178]: 比如说人像，有很多面，画贴图就要把UV拆成一个平面，因为贴图是平面的，所以UV也要拆成平面。
                - figure [ref=f25e179]
                - list [ref=f25e182]:
                  - listitem [ref=f25e183]: • 流程七：烘焙
                - paragraph [ref=f25e184]: 烘焙的目的是将物体高模上的法线信息尽可能完好的记录下来。
                - paragraph [ref=f25e185]:
                  - text: 而做好烘焙的三要素为：
                  - generic [ref=f25e186]:
                    - link "平滑组" [ref=f25e188] [cursor=pointer]:
                      - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E5%B9%B3%E6%BB%91%E7%BB%84&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLlubPmu5Hnu4QiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.pktvuACdJWVkucM4oSqKG6E2v7zqBrBCEQOjgtYCt20&zhida_source=entity
                    - text: ，UV和Cage
                  - text: 。烘焙的过程是将高模的细节
                  - link "信息映射" [ref=f25e192] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=169659422&content_type=Article&match_order=1&q=%E4%BF%A1%E6%81%AF%E6%98%A0%E5%B0%84&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMyOTQsInEiOiLkv6Hmga_mmKDlsIQiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxNjk2NTk0MjIsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.OPF7SIRnPWe4Erak_tajVShqAztX1OqvD-SOxsu2H24&zhida_source=entity
                  - text: 到低模上，这里所谓的细节，就是
