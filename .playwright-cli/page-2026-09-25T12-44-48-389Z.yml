              - generic [ref=f9e98]:
                - paragraph [ref=f9e99]:
                  - text: 先给大家说一下
                  - link "游戏美术" [ref=f9e101] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=1&q=%E6%B8%B8%E6%88%8F%E7%BE%8E%E6%9C%AF&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLmuLjmiI_nvo7mnK8iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxMDczNjQwOTEsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.AgycCeELIXD4hU4Ht1HHDAihDqBTWcjZ4-3ihhyP454&zhida_source=entity
                  - text: 行业的分工吧，主要分为
                  - link "游戏UI" [ref=f9e105] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=1&q=%E6%B8%B8%E6%88%8FUI&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLmuLjmiI9VSSIsInpoaWRhX3NvdXJjZSI6ImVudGl0eSIsImNvbnRlbnRfaWQiOjEwNzM2NDA5MSwiY29udGVudF90eXBlIjoiQXJ0aWNsZSIsIm1hdGNoX29yZGVyIjoxLCJ6ZF90b2tlbiI6bnVsbH0.XW9TN_C2j93ILw5c4Kih4MsaL-8QBGBSV92XVNTGduc&zhida_source=entity
                  - text: 、游戏原画、
                  - link "游戏模型" [ref=f9e109] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=1&q=%E6%B8%B8%E6%88%8F%E6%A8%A1%E5%9E%8B&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLmuLjmiI_mqKHlnosiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxMDczNjQwOTEsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.7AfOtAsESXI-s1_YYET6axganhbycWmENK8L5CwZvMo&zhida_source=entity
                  - text: 、游戏动画、
                  - link "游戏特效" [ref=f9e113] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=1&q=%E6%B8%B8%E6%88%8F%E7%89%B9%E6%95%88&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLmuLjmiI_nibnmlYgiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxMDczNjQwOTEsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.KM8klo2YHWE4kR6RcrgCiG7MdP9atSb9UsinjCL9oA0&zhida_source=entity
                  - text: 。每个分工就是一个公众岗位，主要你做了一个岗位的工作，那就能在这个行业内挣到不错的薪水！所以大家可以认真选择，确定一个方向后，好好努力去学习，提升技能！今天我要给大家分享的是游戏动画也就是
                  - link "游戏动作设计师" [ref=f9e117] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=1&q=%E6%B8%B8%E6%88%8F%E5%8A%A8%E4%BD%9C%E8%AE%BE%E8%AE%A1%E5%B8%88&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLmuLjmiI_liqjkvZzorr7orqHluIgiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxMDczNjQwOTEsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.ShVyF36CPGwwm6anrmuTwfTyXa8-x4H2QZXH11Nk-wo&zhida_source=entity
                  - text: 的工作中是怎么开始工作的！
                - figure [ref=f9e120]
                - paragraph [ref=f9e123]: 首先给大家强调一下，游戏动作设计师是不需要做模型的，也不需要画画，所以这个岗位不需要美术功底，所以喜欢这个行业的小伙伴，都可以尽情的向这个岗位砸简历，它的门槛比其他的岗位要低一点点！但是还是需要扎实的技术实力的！
                - paragraph [ref=f9e124]:
                  - text: 当我们的动画师拿到模型师做好的模型的时候，我们需要做的第一步工作师检查模型师否符合做动画的规范，
                  - link "人体结构" [ref=f9e126] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=1&q=%E4%BA%BA%E4%BD%93%E7%BB%93%E6%9E%84&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLkurrkvZPnu5PmnoQiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxMDczNjQwOTEsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.K8wPeIo74Sn_yiMhLiJUJ7hsHeXdE_xLaAIOmJsQIwA&zhida_source=entity
                  - text: 的布线是否符合动作的制作要求！如果不行的话，那就得打回去，让模型师修改修改了！一般很多模型师做完模型都是甲方验证通过了的，一般不会存在大的问题的。主要就是细节上面要都加注意即可！比如某个飘带需要做的很柔很细致，但是布线很少，那就很那达到这个样的要求，那我们就要跟客户或者项目经理沟通解决！这就是我们动画师工作时，接手到任务，拿到模型需要解决的第一步！
                - figure [ref=f9e129]
                - paragraph [ref=f9e132]:
                  - text: 模型检查好之后，我们就需要对角色进行骨骼的架设，让角色能按照我们的想法去动，那就得匹配上跟真实世界一样的骨骼，这样才方便我们对这个虚拟人物进行各种造型的摆布！在行业内叫做对角色
                  - link "骨骼绑定" [ref=f9e134] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=1&q=%E9%AA%A8%E9%AA%BC%E7%BB%91%E5%AE%9A&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLpqqjpqrznu5HlrpoiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxMDczNjQwOTEsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.yRTcdXr_jUcEI7vG_E89mwuZvFFIV4D7oOrHvipeUfo&zhida_source=entity
                  - text: ，这是一个比较枯燥无味的工作，刚开始你会觉得很繁琐，但是当你做多了，能快速实现这个绑定之后，那就是很简单的一个工作，这个工作没得什么技术含量，我最开始做动画的时候，就是从绑定做起走的，高峰的时候，一天可以做7个角色的
                  - link "蒙皮" [ref=f9e138] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=1&q=%E8%92%99%E7%9A%AE&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLokpnnmq4iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxMDczNjQwOTEsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.OVlBRzD59NJj4LWp-uQetBUp5o2NMk4RU_D1rZyy53Q&zhida_source=entity
                  - text: ！
                - figure [ref=f9e141]
                - paragraph [ref=f9e144]:
                  - text: 关于这第一第二点，我这边有一个免费的教程推荐给大家，希望可以让你进一步的熟悉
                  - link "动画师" [ref=f9e146] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=3&q=%E5%8A%A8%E7%94%BB%E5%B8%88&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLliqjnlLvluIgiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxMDczNjQwOTEsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MywiemRfdG9rZW4iOm51bGx9.KFz5_a6ddFjyX_-Mv0MBxfvk2W4m_XYy4Daim_aoaq0&zhida_source=entity
                  - text: 的工作流程！
                - link [ref=f9e150] [cursor=pointer]:
                  - /url: https://link.zhihu.com/?target=https%3A//ke.qq.com/course/425373%3Ftaid%3D3595042246000029%26tuin%3D632d4de
                - paragraph [ref=f9e155]:
                  - text: 当角色有了骨骼，模型也能很好的跟着骨骼动起来的时候，下一步我们就需要做动作设定了，每一个角色在游戏策划哪里有个详细的动作描述，我们将会根据文字的描述，来设计角色的动作，并赋予到
                  - link "虚拟角色" [ref=f9e157] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=1&q=%E8%99%9A%E6%8B%9F%E8%A7%92%E8%89%B2&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLomZrmi5_op5LoibIiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxMDczNjQwOTEsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.GHF8ySZTo5lUNnlxUiiDc9cFHVCVRkeq6K4rzNCBn1g&zhida_source=entity
                  - text: 上去！我们大致要做到的动作如下图所示：
                - figure [ref=f9e160]
                - paragraph [ref=f9e163]:
                  - text: 这个部分其实也就是我们最主要的环节了。这些动作怎么才能做得更好呢？那就需要你去掌握好角色的
                  - link "运动规律" [ref=f9e165] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=107364091&content_type=Article&match_order=1&q=%E8%BF%90%E5%8A%A8%E8%A7%84%E5%BE%8B&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMwODEsInEiOiLov5Dliqjop4TlvosiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoxMDczNjQwOTEsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.R2-BTvF3jkX9sNuePTteiFZKwAOk-jkvFfbWvXlfFoA&zhida_source=entity
                  - text: 等等相关的知识！关于动作的设计和制作，那和你很多的知识点，今天主要是给大家介绍动作师的工作流程，所以不讲太多的技术相关的，如果你想了解更多的，我还是推荐一个免费的教程给你，希望可以帮到大家！
                - link [ref=f9e169] [cursor=pointer]:
                  - /url: https://link.zhihu.com/?target=https%3A//ke.qq.com/course/427332%3Ftaid%3D3505925969577284%26tuin%3D632d4de
                - paragraph [ref=f9e174]: 还有一点动画原理方面的教程，欢迎学习，也欢迎分享！
                - link [ref=f9e176] [cursor=pointer]:
                  - /url: https://link.zhihu.com/?target=https%3A//ke.qq.com/course/425253%3Ftaid%3D3570934594567461%26tuin%3D632d4de
                - paragraph [ref=f9e181]: 最后给大家看几个做好了的成品动画，也是我们要入行这个岗位，需要达到的一个基本能力的展示吧！
                - figure [ref=f9e182]:
                  - generic [ref=f9e184] [cursor=pointer]
