                    - generic [ref=f15e232] [cursor=pointer]:
                      - generic [ref=f15e236]:
                        - generic:
                          - paragraph: 看你们说了很多，我的计划是在下个月辞掉我在国企的工作，现年33岁。和你们的情况有点不一样。我一直都特别想从事游戏的行业。除了我喜欢玩以外，还因为我对美术就有天生的喜好，不论作品好还是不好，我觉得做这个行业我才会开心，所以我选择。
                          - paragraph: 既然大家都以结构化的方式来回答，我也尊重这种规则吧。
                          - paragraph: 大问题分三点：
                          - paragraph: 一，我已婚，孩子在今年七月份就出生，距现在来说还有三个月。
                          - paragraph: 所以现在这种状态我是转不了行的，也不会有游戏公司聘用。过去没有相关行业的工作经验也是求职的瓶颈。
                          - paragraph: 二，专业已经丢弃多年。
                          - paragraph: 不能怪父母，因为他们没有眼光是他们的事。只怪自己没有坚定地，坚持地走下去。在过去几年的社会实践上，总结了，自己不对自己恨，后悔根源就不能怪别人。所以过去各种原因放下了自己的专业都因为没有这份信心。当然33岁才醒觉还不算迟。各种家庭的压力都可以担得起来了。已经不会因为什么东西放不下，最坏的打算就是找了一份普通的美工工作，工资比不上以前。但至少是我喜欢的工作。
                          - paragraph: 三，入门门槛真不少。
                          - paragraph: 如今已经不是有一手好的画风，或是懂几吓PS就能混饭食的时代了。游戏发展业已经非常地看重效率和利益，懂的技能越多，公司越愿意用。毕竟国内有很多小型游戏公司需求的质量高，但一般能力高的人也会对薪酬要求高。小型游戏公司没有太多的资金来长期聘用深度专业的人。可能他们老板本人就是一个专业人材，自己出来单干的，一山不能藏二虎。所以不会有两个美术总监就是这样。说远了，近在眼前的问题是要学习MAYA和3D MAX。这两门东西不能一起学，建模就是建模，学3D MAX。做动画就做动画，学MAYA。年龄上了30岁，没有很好的根基的话，必须选一而专，深度垂直地学习，做得到一些比较冷门的较果，或掌握一定深度的技能，才是上了年纪在求职上表示个人成熟，不是朝三幕四的好的工作者。
                          - paragraph: 另外到了该职业的发展路线：
                          - paragraph: 一，注重自修：
                          - paragraph: 30过后转行从0开始是要有一定规划的。就具体做游戏人物或场影，特效之类的设计而言。一直干这个我愿意干到退休，但人体大脑有些东西很恐怖，老了后我很怕自己变得死板，到时候会变得为了设计而设计。这样出品的效果会非常差，也相当于败坏个人名声，所以坚持着对美术，艺术类的学习是一刻都不能停的。必须抽空去看多点别人的艺术展览，学习每一个时代不同的审美观。学习哲学，用哲学的思维帮助自己更正或更新自己的世界观。并且保持着对专业软件的新SKILL学习。尽量做到不要被这个行业淘汰。
                          - paragraph: 二，对于工作环境的一些设想：
                          - paragraph: 过去在体制内，很多事情不是你设想得不够好，而是一个好的设想多数要花数年来完成才能长期的运作下去。相信很多体制内呆过的人都知道，办公系统，OA系统，审视，申请，各类系统每年都在增加。这些全是没有太过深入的架设的产物。体制的问题重点还是在于领导的换届上，一任领导一般就呆个三五年。在这个时间内他们要有好的功绩才能得到下一个三五年的上升发展机会。所以如果一个好的想法的项目你说要做一年的准备工作，不好意思，批了归批了。你继续给我把日常的东西，领导的关系单位，全部服务好了再去做你的项目，时间就是生命，你把一个一年的预备期可能到实施出来得3年时间。领导等不了，说真的，自己也等不了。不管你是20来岁还是像我一样年龄。如果你有创业的念头，要在这个项目上赚足点眼球的话，我的建议会是相反的。必须要坚持坚持再坚持。所以工作环境中，自我定位的角色不想进入管理层。好好地与一班从事设计的伙伴平面化地提出问题，向大家请教，用自我的知识帮助周围的同事。这是更理想的工作状态。由此引出了“我既然这么不上进，为什么还是转行的原因。”请听三题~
                          - paragraph: 三，“我既然这么不上进，为什么还是转行的原因。”
                          - paragraph: 我孩子快要出生了，看着身边很多朋友的孩子都开始打酱油了。面对着陌生的人生路，孩子们会有很多种五花八门的问题会问父母。很多朋友可能只是一个简单到不能再简单的问题：爸爸，为什么不吃面包？（我是南方人，我父母就是不吃面包的人，不管中式，西式。都不吃。）可能很多当爹的就会正常的说爸爸不喜欢吃。或者直接点的理由就告诉孩子门面包太干了，我要喝很多水才能吃完，一会就会经常找洗手间。这些其实全TM是大人的生活习性的借口。中原以比的人还不是天天离不开面食~
                          - paragraph: 这个问题最有意思的是，小孩子问的问题往往是人生的一种路线的选择瘾性心理暗示。TA想从父母的答案里获某些行为的理由和信息。所以我就是一个从小就没有很好地享受到面食 的美味的南方长大的小孩子。直到碰到我的妻子，她很爱西点，西式面包，蛋糕，中开面包，糕点。中她在一起我发现有某些东西还是非常美味，同时与折射了一些个人缺陷出来。在她的帮助下，我的思维开始变得广阔。
                          - paragraph: 重点来了，回答这个问题用了这么长的一个故事。其实就是为了孩子未来一定会问我的一个问题：“爸爸，你的工作是做什么的？”我想好好地给TA这个答案：“爸爸从小就很爱画画，所以我在做的工作就是我最喜欢做的事，你如果已经有自己喜欢做的事情，只要你愿意，你就可以把它作为你的工作去享受这其中的乐趣。”方向盘在他的手上，除了为非作歹，什么事情都应该让TA自己去试试，只要他愿意，我会把我力所能及的全部条件都给TA。
                          - paragraph: FOR：知乎里的每一位爸爸妈妈或未来的爹娘。
