                      - generic [ref=f15e186]:
                        - generic:
                          - paragraph: 谢邀，第一次被邀请..
                          - paragraph: 问题真是又长又多啊。。。。
                          - paragraph: 1.国内对游戏特效师在需求来自那种公司
                          - paragraph: 每个游戏都会有特效，某些类型的游戏可能会少一些，某些可能多一些，如果一个公司有好几个项目同时在研发，
                          - paragraph: 那么特效师可能会是几个项目共用的，所以没有说主要来自于哪种公司，每个公司都必备的。
                          - paragraph: 2.不同类型的公司对游戏特效师的要求和侧重以及需求量是否不同？差异体现在哪里？一般是怎么分类？通常是按照游戏的3D/2D来划分？又或者是写实与卡通化来区分？
                          - paragraph: 我再纠正一下，所有划分单位，都是以项目来讲的，不是说一个公司里所有项目都差不多，同公司项目之间也有很多差异，2d还是3d的区别是最直观的，写实还是卡通也会分，主要是来自于那款项目的：
                          - paragraph: 题材（东方还是西方，对阵法和文字的选用）
                          - paragraph: 主色调（比如暗黑3整体就很暗饱和度也不高，特效就不适合用太鲜艳太曝光的路线）
                          - paragraph: 美术风格（写实还是卡通，这两种的灰尘的颜色和形状就有很大区别）
                          - paragraph: 3.关于工作机会
                          - paragraph: 都是网游公司提供这是当然的，单机现在真不知道有哪些还活着，国内我知道的就两个，蜃楼和古剑奇谭。
                          - paragraph: 4.分工这个事，看你上级安排，流程不是很细，多大公司都这样，顶多分ui特效，技能特效，场景特效，但是不可能你做一点，再换下一个人做一点，特效这个工种不太适合拆分,除非是空余时间制作一些常用素材，有的做烟雾，有的做爆点，以备不时之需。
                          - paragraph: 5.出国先学语言，语言过关了 ，有些外企是有一年数次的出国学习的机会的，能不能留在那儿就看你自己做的东西好不好了，就这么简单，这次不行再下次，没什么好取巧的。
                          - paragraph: 6.你的个人竞争力除开工具，就是你对游戏的浸染，你的个人品味和悟性，你的努力程度，还有你的心态，简单来说，就是你除开工作需要，你这个人是不是人才，不管这世上行业再怎么多，对于综合素质的重要性都是统一的，都是常年来大家一再强调的那些词而已，坚强，上进，务实。
                          - paragraph: 7.如果你参加工作了，在工作时间里，能让你去学习进步的就不太多了，你得自己找时间去提高，这是基本心态，如果你老大给你时间边学边做，那就属于他的额外投资，如果他不仅给你时间了还教你，那你就该懂得感恩了。
                          - paragraph: 说到底，还是你能做出什么样的作品出来，独立游戏里的特效也好，项目里的特效资源制作也好，或者你自己私下的练习也好，都是同一件事，没必要分开对待。
                          - paragraph: 8.网站的话有直线教程网，cgjoy，你能把这两个网站的教程都学会了，你都可以去开班了。
                          - paragraph: 9.现在的培训质量都还不错，我是说如果你认真学，悟性高的话，不管是火星时代还是cgjoy上的培训，对于新人来说都是有用的，因为杯子根本就是空的，灌多少水，都比之前要有收获。
                          - paragraph: 10.其实你没必要问这么多，现在你所有问题都来自于你想的太多，做的太少，你一直在想找捷径，好像制定了一个什么路线立马就事半功倍了，这才是新人最大的障碍，你以为老人就是在这些方法论上停留研究的吗？如果有什么百试百灵的忠告，就只有那句：just do it！
