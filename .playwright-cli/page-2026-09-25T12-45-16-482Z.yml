                        - generic:
                          - paragraph: 通俗粗劣的回答一下
                          - paragraph: 游戏特效师的需求那就是来自游戏公司 分类其实总的来分应该分两种
                          - paragraph: 第一种 就是俗称的2D特效 通常不限制软件 只要求制作完整的序列图导入进游戏可用即可
                          - paragraph: 第二种 就是俗称的3D特效 通常是基于特定引擎 例如U3D Unreal CE 等成熟引擎 并使用引擎自带的粒子系统来进行制作
                          - paragraph: 至于写实与卡通 是基于游戏风格和特效风格来确定的
                          - paragraph: 至于分工 其实并没有什么太大的细分 即 分配给你一个特效效果 那么把他制作完成便是你的工作 至于在过程中所需要用到的例如模型 贴图 等都是靠自己的制作和收集 PS.也偶尔可以找同事代劳一下 前提是别人愿意帮你
                          - paragraph: 关于核心竞争力思考不多 所以暂不回答 入行标准 也比较笼统 什么算入行 独立完成一个特效算入行还是成功进入公司正式工作算入行
                          - paragraph: 如果从公司招聘的角度来说 衡量的标准就是好不好看 那么好不好看就又会牵扯到 特效是否符合考核的需求 风格是否符合公司的审美 色彩搭配是否惊艳并不突兀 运动规律是否合理等等
                          - paragraph: 至于入行途径的话 推荐一些知名的培训机构比较快速 当然也可以自学 我也算是自学的吧 也不是美术出生 没有美术基础 所以前期的路还是比较艰难的 以后提升也会遇到瓶颈
                          - paragraph: 特效的侧重修行就是提升美感 开创思维 多看 多想 多做 并且特效是需要全面提升的 简单点来说就是各种工具都要会 包裹但不仅限于max和ae的插件 而且这也顺便回答了你的另一个提问 是专注于游戏特效不封的制作还是应该全面培养并努力尝试游戏开发中可能涉及到的各部分美术制作任务 答案就是你所要学的一切都是为了提升你制作的特效而服务
                          - paragraph: 通常在学习的过程中都会碰到各种不同的游戏风格类型 都需要尝试 并且先找一个自己能最快入手的类型 熟悉后在广泛涉及别的风格
                          - paragraph: 除了参加公司的实习外就是多看相关论坛或者网站多想别人学习 看的多做的多自然就明白的多 真理
                          - paragraph: 培训机构确实是一个快速粗暴的入门途径 和所有学习一样 老师都很重要 而且通常培训机构和一些公司之间联系也比较紧密 有培训机构的推荐比自我推荐投简历是要快一些并且途径也多一些 一般将培训毕业的新生推荐成功进入公司也相应的提升了培训机构的口碑和名声 算是双赢 以后从事培训机构也算出路
                          - paragraph: 现在的培训机构大都是聘请从某些知名公司出来后的特效师们进行授课 虽然风格可能不太相同 但是确实算是主流的需求体现
                          - paragraph: 至于特效外包 有 不多 因为特效算是一个感性化偏重的东西 所以双方的沟通变得很重要
                          - paragraph: 留意的变化的话应该算VR AR BR 之类的
                          - paragraph: 大致就是这样 以上 如果有什么不妥请指出 感谢！
