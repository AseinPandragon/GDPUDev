                        - generic [ref=f19e169]:
                          - link "酷coo豆" [ref=f19e173] [cursor=pointer]:
                            - /url: //www.zhihu.com/people/ku-coodou
                          - generic [ref=f19e174]: 全链路UI设计网站长，专注分享UI行业干货。
                      - button [ref=f19e177] [cursor=pointer]
                    - generic [ref=f19e182] [cursor=pointer]:
                      - generic [ref=f19e186]:
                        - generic:
                          - paragraph: 游戏UI设计，相比传统信息资讯类App的用户界面设计，会更加注重手绘功底。因此，想做游戏UI设计师，在大学期间需要着重自学的，就是手绘方面的基本功。包含手绘在内，还有5大基本功，接下来我将为大家一一讲解。
                          - paragraph:
                            - text: 游戏UI设计师-Jack，在他的书籍《游戏UI设计实战必修课》，也提到了UI设计师所需具备的5大基本功，其中手绘便是5大基本功的能力之首。他在书中说道：手绘能力强弱决定设计师是否能迅速有效地表达自己脑中的创意和想法，同时手绘能力也是提高设计工作效率的“利器”。
                            - superscript:
                              - link "back《游戏UI设计实战必修课》案例丰富，讲解步骤细致，自学游戏UI设计的指南丛书。 https://u.jd.com/LT1w4d":
                                - /url: "#ref_1"
                                - text: "[1]"
                          - figure
                          - paragraph: 很多经典游戏作品，如暴雪公司的《魔兽世界》《暗黑破坏神》和《星际争霸》等最早期都是从一些草图设计开始的。在工作前期游戏美术设计师，通常会把脑海中的游戏世界和一些设计思路勾勒在草稿纸上，当然，一个优秀的UI设计师也不例外。
                          - figure
                          - figure
                          - figure
                          - paragraph: 因此，出色的手绘功底是必不可少的，而且通过一些简单的草图绘制和创意提炼可以更容易提升设计师自身的设计水平，上述几张图片，便是游戏UI设计师-Jack平时练习的一些设计草图，有临摹的，也有原创的设计过程图。与此同时，UI设计师需要具备的5大基本功包括有：
                          - heading "1、手绘基本功。（最最最重要的！）" [level=2]
                          - paragraph:
                            - text: 手绘功底的重要性，上面段落已经说得很详细了。至于该如何练习手绘能力，那就是又回到我们老生常谈的素描知识了。也就是基础的透视规律（一点、两点、三点）、光影规律（三大面、五大调）是要掌握的，如何用结构素描表达各种物体或块体的结构关系，以及用明暗素描表达光影关系，这都需要通过足量的练习，内化成自身条件反射的专业能力
                            - superscript:
                              - link "back《素描基础入门篇-解密黑白灰》，任何视觉设计师，都应掌握的手绘基础。 http://u.qinxue.com/t17921/172":
                                - /url: "#ref_2"
                                - text: "[2]"
                            - text: 。
                          - paragraph:
                            - text: 具体的学习教材，可以参考
                            - link "《素描基础入门篇-解密黑白灰》":
                              - /url: https://link.zhihu.com/?target=http%3A//u.qinxue.com/t17921/172
                            - text: ，通过系统训练，当你具备扎实的素描专业知识后，还需要有针对性的训练游戏类题材元素的绘画，比如常见的武器装备、游戏道具、宝箱、魔法书...
                          - heading "2、色彩基本功。" [level=2]
                          - paragraph: 颜色分为暖色和冷色两大类，设计师在做设计的时候应合理搭配和运用好不同的颜色，这样设计出来的作品才会看着非常舒服，如果搭配不好，会让人感觉色彩混乱而不协调。
                          - heading "3、软件基本功" [level=2]
                          - paragraph: 软件当然不是越多越好，学几款常用的就可以了，了解越多的软件会分散自身时间和精力。因为任何一款软件专研精通了，加上自己的创意思维，都可以完成超赞的设计，千万不要觉得别人的作品厉害，是因为软件比你先进，新人千万要走出这个误区。无论你是学习平面设计、网页设计还是其他设计都一样。
                          - paragraph: 在游戏UI设计领域，只要精通了Photoshop，就足够完成日常工作中的所有设计工作任务，借助Photoshop的强大功能，既能满足原画设计、又能满足游戏UI设计的工作需求，所以精通了PS完全不需要使用其它软件。
                          - paragraph: 当然，其它软件也有自身优势，比如SAI在绘画线条很棒，但是不能用来做UI界面。Adobe illustrator 用作矢量绘图非常方便，但不如PS做UI设计控制精准。所以，作为一名合格的设计师，一定要掌握一个非常熟练的软件，这是保证自身设计工作得以顺利开展的前提！
                          - heading "4、版式设计基本功" [level=2]
                          - paragraph: 版式设计，是任何视觉设计工作的最基本能力之一，在做排版设计、游戏交互等很多方面的内容时都需要考验设计师的版式设计能力。一个好的版式设计就体现在构图是否有主次之分、色彩搭配是否合理、整体是否能够给读者带来愉悦的心情。好的设计师往往能通过版式设计来突出设计重点，给读者带来一种视觉冲击力。
                          - figure
                          - figure
                          - paragraph:
                            - text: 对版式的把控能力，无论你是游戏UI设计师、还是平面、网页设计师，都可以通过
                            - link "《写给大家看的设计书》":
                              - /url: https://link.zhihu.com/?target=http%3A//www.xxriji.cn/books/layout/109.html
                            - superscript:
                              - link "back《写给大家看的设计书》，影响一带设计师的经典图书。 http://www.xxriji.cn/books/layout/109.html":
                                - /url: "#ref_3"
                                - text: "[3]"
                            - text: 来补给这方面的专业知识，因为，这本书提及到的排版经验，对视觉类设计都是非常经典适用的。如果你是平面、网页设计方向，还可以看看这个视频教程《
                            - link "人人都能学会的版式编排设计":
                              - /url: https://link.zhihu.com/?target=http%3A//u.qinxue.com/t17921/340
                            - text: 》，来加强这方面的实操训练能力！
                          - heading "5、创意基本功" [level=2]
                          - paragraph: 有人曾经说过：“学习应该像蜜蜂采蜜，倘若叮在一处，所得就非常有限。”时常有初学者抱怨说自己脑海中的创意太少了，实在想不出好的创意，这个问题在作者看来都是因为平时看得少、想得少并且练得也少所导致的。
                          - paragraph: 还有很多初学者存在一个误区就是，以为自己是设计师，只看设计方面的资料和素材就可以了，其实不然。如果真想做好设计，平时我们要学会多看一些好的插画、原画、摄影、三维、平面设计、手绘草图等，养成积累素材和灵感的好习惯。
                          - paragraph: 除此之外，还要尝试对一些其他的领域进行了解，同时关心生活，这样才有利于逐步提高自己的审美能力，丰富大脑的创意思维。
                          - figure
                          - figure
                          - figure
                          - figure
                          - heading "总结" [level=2]
                          - paragraph: 任何学习，可以说都是从模仿开始的。想做游戏UI设计师，那就找到内行人，追随他而去，汲取他的学习方法，以及所需具备的专业能力知识体系。私下里要靠自己不断的多看、多练、多想，这便是最有效率的学习方法了。在此呢，给大家推荐两个游戏UI设计这领域的设计师：
                          - heading "其一就是Jack（邓杰）老师。" [level=3]
                          - paragraph: 他曾先后就职于腾讯、网易、金山和EA等游戏公司，做过很多优秀的游戏UI设计，上面所举例图片均是jack老师的一些设计作品，现在主要从事游戏UI设计方面的教育工作。
                          - paragraph:
                            - text: Jack老师的出版书籍：
                            - link "《游戏UI设计实战必修课》":
                              - /url: https://link.zhihu.com/?target=https%3A//union-click.jd.com/jdc%3Fe%3D%26p%3DAyIGZRtYFAcXBFIZWR0yEgRUH1IdCxM3EUQDS10iXhBeGlcJDBkNXg9JHU4YDk5ER1xOGRNLGEEcVV8BXURFUFdfC0RVU1JRUy1OVxUBEwNcE1IUMltRLFMPdHdVYjYYI08YVW9TbCVKaVQLWStTFgQTN1UaWhQDFQRUHF8lMhIEZUk1zbSk3%252FCqR8GondLdjGsQARIDXR5eEgMiB1EcXxwGEQVSH1MQBCIAVRJrFgoaAVEdWxACDg5WGV0QBSI3VRhaEQsaDlQrWCUyIgdlGGtXbBZTVUleQQQRBlMfDxBQEQYFGA8RBBUEABJTRgNHDlEbaxcDEwNc
                            - text: "-人民邮电出版、录制的游戏UI入门教程："
                            - link "《游戏UI界面制作实战教程》":
                              - /url: https://link.zhihu.com/?target=http%3A//u.qinxue.com/t17921/271
                            - superscript:
                              - link "back《游戏UI界面制作实战教程》，Jack录制的游戏UI界面制作入门实战课。 http://u.qinxue.com/t17921/271":
                                - /url: "#ref_4"
                                - text: "[4]"
                            - text: 。
                          - heading "其二是设计师lesen（站酷ID：欧型兔）" [level=3]
                          - paragraph: 中文名：李世欣。冰岛CCP公司亚洲代表处DUST Development资深界面设计师，Flash Artist。追波玩家，站酷推荐设计师，从事多年界面设计行业，亦于动画行业有深厚造诣。优秀作品横跨动画，游戏，商务化应用几个门类,多次获得行业内比赛的高等奖项。
                          - paragraph:
                            - text: 这位老师的游戏UI设计代表作有“腾讯全民枪王”，据说这个游戏项目的UI工作耗时1年多，累计输出设计稿30200份，标注稿3135份、交互稿522份、动效DEMO接近200份。想了解这份游戏UI项目的设计总结，请移步：
                            - link "《全民枪王》2015年度设计总结":
                              - /url: https://link.zhihu.com/?target=https%3A//www.zcool.com.cn/work/ZMTk2OTQ4NjA%3D/1.html
                            - text: 。
                          - paragraph:
                            - text: 设计师lesen录制过的一些UI教程有《
                            - link "精品UI图标制作教程":
                              - /url: https://link.zhihu.com/?target=http%3A//u.qinxue.com/t17921/23
                            - text: 》，地址：
                            - link "http://t.cn/R5p9vrH":
                              - /url: https://link.zhihu.com/?target=http%3A//u.qinxue.com/t17921/23
                            - text: ，教程通过演示五个图标的详细制作，告诉大家如何表达一个图标的意义以及写实和抽象之间的关系。
                            - superscript:
                              - link "back《精品UI图标制作教程》，游戏UI设计师，绘制界面图标的必修技法课！ http://u.qinxue.com/t17921/23":
                                - /url: "#ref_5"
                                - text: "[5]"
                          - figure
                          - figure
                          - figure
                          - figure
                          - paragraph: 你的好奇心和持续的热爱，将驱使你看到更多！望以上分享的学习资料，以及设计师推荐，对大家有所帮助。
