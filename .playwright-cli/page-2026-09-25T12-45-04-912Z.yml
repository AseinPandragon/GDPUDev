                - paragraph [ref=f13e91]: 2.游戏特效师的学习路线
                - paragraph [ref=f13e92]:
                  - text: 基础美术技能：包括绘画、
                  - link "色彩理论" [ref=f13e94] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=252299163&content_type=Article&match_order=1&q=%E8%89%B2%E5%BD%A9%E7%90%86%E8%AE%BA&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMDEsInEiOiLoibLlvannkIborroiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNTIyOTkxNjMsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.NnmOET4MkNKWHCD6bHSbs6fo4vjnGhFtzGAywvVYz8A&zhida_source=entity
                  - text: 、构图等，这些是所有
                  - link "视觉艺术" [ref=f13e98] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=252299163&content_type=Article&match_order=1&q=%E8%A7%86%E8%A7%89%E8%89%BA%E6%9C%AF&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMDEsInEiOiLop4bop4noibrmnK8iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNTIyOTkxNjMsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.U798XMP3kracersB38Fval_aCR6nCZWu0PpnJsPoPRQ&zhida_source=entity
                  - text: 的基础。
                - paragraph [ref=f13e101]:
                  - text: 3D建模和渲染：了解
                  - link "3D模型" [ref=f13e103] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=252299163&content_type=Article&match_order=1&q=3D%E6%A8%A1%E5%9E%8B&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMDEsInEiOiIzROaooeWeiyIsInpoaWRhX3NvdXJjZSI6ImVudGl0eSIsImNvbnRlbnRfaWQiOjI1MjI5OTE2MywiY29udGVudF90eXBlIjoiQXJ0aWNsZSIsIm1hdGNoX29yZGVyIjoxLCJ6ZF90b2tlbiI6bnVsbH0.x6eyW-Ckd90mxTcrNrT2e0rwN0KOjQ1gpM_FG_zRvNA&zhida_source=entity
                  - text: 的创建、编辑和渲染流程，软件如3ds Max、
                  - link "Maya" [ref=f13e107] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=252299163&content_type=Article&match_order=1&q=Maya&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMDEsInEiOiJNYXlhIiwiemhpZGFfc291cmNlIjoiZW50aXR5IiwiY29udGVudF9pZCI6MjUyMjk5MTYzLCJjb250ZW50X3R5cGUiOiJBcnRpY2xlIiwibWF0Y2hfb3JkZXIiOjEsInpkX3Rva2VuIjpudWxsfQ.SPH45Xw8dEXcclN4kNfSuBWc1eE1hi0msUlTt6V4p1M&zhida_source=entity
                  - text: 或Blender。
                - paragraph [ref=f13e110]:
                  - text: 特效制作软件：掌握
                  - link "Adobe After Effects" [ref=f13e112] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=252299163&content_type=Article&match_order=1&q=Adobe+After+Effects&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMDEsInEiOiJBZG9iZSBBZnRlciBFZmZlY3RzIiwiemhpZGFfc291cmNlIjoiZW50aXR5IiwiY29udGVudF9pZCI6MjUyMjk5MTYzLCJjb250ZW50X3R5cGUiOiJBcnRpY2xlIiwibWF0Y2hfb3JkZXIiOjEsInpkX3Rva2VuIjpudWxsfQ.4S2_nx4_cTGP5bQN1c0xskP7pZJ5CRxAcb1HKSJmcJc&zhida_source=entity
                  - text: 、Houdini或
                  - link "UE4" [ref=f13e116] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=252299163&content_type=Article&match_order=1&q=UE4&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMDEsInEiOiJVRTQiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNTIyOTkxNjMsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.WrXX-R4uabtpnEXBAYzsSbhNCu6txp8v7CbEyDeYlCU&zhida_source=entity
                  - text: 等软件的使用。
                - paragraph [ref=f13e119]:
                  - text: 粒子系统和动力学：学习特效制作的基本原理，如
                  - link "粒子系统" [ref=f13e121] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=252299163&content_type=Article&match_order=2&q=%E7%B2%92%E5%AD%90%E7%B3%BB%E7%BB%9F&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMDEsInEiOiLnspLlrZDns7vnu58iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNTIyOTkxNjMsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MiwiemRfdG9rZW4iOm51bGx9.um13MWBfrDoXy22nIBAxBf0BUY2ZHTcq_XHHmIDJaDU&zhida_source=entity
                  - text: 、材质系统、光照和阴影等。
                - paragraph [ref=f13e124]: 脚本和编程：学习使用脚本和编程来增强特效的制作能力。
                - paragraph [ref=f13e125]:
                  - text: 游戏引擎：熟悉如Unity和
                  - link "Unreal Engine" [ref=f13e127] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=252299163&content_type=Article&match_order=1&q=Unreal+Engine&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMDEsInEiOiJVbnJlYWwgRW5naW5lIiwiemhpZGFfc291cmNlIjoiZW50aXR5IiwiY29udGVudF9pZCI6MjUyMjk5MTYzLCJjb250ZW50X3R5cGUiOiJBcnRpY2xlIiwibWF0Y2hfb3JkZXIiOjEsInpkX3Rva2VuIjpudWxsfQ.0WV_QRcAqSaysRav_MWWegr8swApuQDbY6sLqwa-79c&zhida_source=entity
                  - text: 等游戏引擎的特效制作工具和渲染技术。
                - paragraph [ref=f13e130]
                - paragraph [ref=f13e131]: 3.零基础小白怎么学游戏特效
                - paragraph [ref=f13e132]: 基础阶段：学习基础绘画技巧和色彩理论，掌握特效制作软件的基础操作。
                - paragraph [ref=f13e133]:
                  - text: 进阶阶段：学习3D建模技术，包括创建3D对象、贴图、灯光设置等，以及基础的
                  - link "动画原理" [ref=f13e135] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=252299163&content_type=Article&match_order=1&q=%E5%8A%A8%E7%94%BB%E5%8E%9F%E7%90%86&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMDEsInEiOiLliqjnlLvljp_nkIYiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNTIyOTkxNjMsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.Hu4C1NXH53Npwi71W8kSK-eD_qVjGPCGfag4_-26tcw&zhida_source=entity
                  - text: 。
                - paragraph [ref=f13e138]: 实践阶段：参与实际的游戏特效制作项目，提升实战能力。
                - paragraph [ref=f13e139]:
                  - text: 提升阶段：学习更高级的特效制作技术，如
                  - link "实时渲染技术" [ref=f13e141] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=252299163&content_type=Article&match_order=1&q=%E5%AE%9E%E6%97%B6%E6%B8%B2%E6%9F%93%E6%8A%80%E6%9C%AF&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3OTA1MTMxMDEsInEiOiLlrp7ml7bmuLLmn5PmioDmnK8iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNTIyOTkxNjMsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.RO79dGz36pRnUwbdJfZ-_Y7O5uxrWJeoIGO8wO6AanM&zhida_source=entity
                  - text: 、物理引擎模拟等，同时培养创意和审美能力。
                - paragraph [ref=f13e144]
                - paragraph [ref=f13e145]: 3.零基础小白怎么学游戏特效
                - paragraph [ref=f13e146]: 小白成为游戏特效师虽然开始时可能会感到有些难度，但通过逐步学习和实践，可以逐渐掌握所需的技能。重要的是保持学习的热情和耐心，不断积累经验。
                - paragraph [ref=f13e147]: 如果有一定基础利用碎片话时间学习，可以利用各种网站提供的在线课程，或者b站up主上传的教程视频，如果你是纯小白想入行找工作，那建议找专业的培训机构系统性学习，会少走很多弯路。
                - paragraph [ref=f13e148]: 培训机构可以提供高端的学习设备，舒适的学习环境，课程内容直接匹配到企业岗位要求，所学即所用。也会提供全方位的就业指导，同时和大量企业建立人才合作关系，可以为学员提供面试指导和工作内推。
                - separator [ref=f13e149]
                - paragraph [ref=f13e150]: 如果同学们对相关培训有兴趣的话，也可以在评论区留言我都会一一回复
