                      - generic [ref=f3e316]:
                        - generic:
                          - paragraph: 0基础如何学游戏原画，游戏原画网课哪个好？零基础学游戏原画一定要注意这些误区！很多接触过画画的新人都会对画画行业产生一些误解。这些误解很多不是具体的技术问题，而是根本性的概念错误。这样的误解很容易让萌新栽跟头。希望本期内容对大家有所帮助。
                          - figure
                          - paragraph: 先推荐2篇绘画学习必备指南，收藏必读！别吃灰：
                          - paragraph:
                            - generic:
                              - text: 一：
                              - generic:
                                - link "10大零基础自学绘画闯关地图【学习有方法】":
                                  - /url: https://link.zhihu.com/?target=https%3A//www.qingwk.com/school/lesson%3Futm_source%3Dtuiguang%26utm_campaign%3Dzdy%26utm_medium%3Dzh
                            - generic:
                              - text: 二：
                              - generic:
                                - link "100万绘画练习作业库【练习有方向】":
                                  - /url: https://link.zhihu.com/?target=http%3A//www.qingwk.com/coach%3Futm_source%3Dtuiguang%26utm_campaign%3Dzdy%26utm_medium%3Dzh
                            - text: 学绘画最怕的是踩坑和迷茫，有了方向就会事半功倍！
                          - paragraph: 素描，素描是原画中最重要的基本能力，也是最简单的。你不需要美术基础，你只需要学会画黑、白、灰和简单的明暗处理。这些绘画基础可以在学习一两个月后掌握。然而，如果你想画得好，你必须学习素描中的光线、透视、虚拟现实和其他知识，否则无论你画得多好，你的画就是一盘散沙，看不出技术水平。除了光影和透视外，虚拟现实还包括明暗面的虚拟现实和细节的虚拟现实处理。事实上，还需要学习素描，因为素描本身更能表达人物动作的动态。
                          - paragraph: 有很多同学学习原画，是从模仿别人的作品开始的。特别喜欢模仿一些动画角色，这是很好的开始。人物角色可以模仿，但是素描不能模仿，素描必须作为设计练习，而不是简单的一比一的复制静态物体。于此同时，颜色，也需要你系统性的学习，如果你只会简单地复制别人的角色，就需要多练习。一般来说，这需要一年左右，需要掌握学习颜色关系、颜色和其他知识，这需要专业培训课程来掌握。
                          - paragraph: 推荐两个绘画学习必备平台：
                          - paragraph: 第一个：轻微课
                          - paragraph: 轻微课的魔鬼绘画特训课程非常火，魔鬼督学+通关晋级模式，轻微课网站上有150万学生作业，可以自行去看看。
                          - paragraph: 第二个：触站
                          - paragraph: 触站是国内人气最高的画师平台，上面有非常多的优秀作品可以参考学习，顺便可以关注一波喜欢的画师。
                          - figure
                          - paragraph: 以上是整个学习过程中最重要的能力，无论你培训后是否选择从事原画的相关专业，对你来说，这些基础需要不断记忆和熟练，尽可能记住最基本的艺术相关技能，不要学习快，忘的也快。当你面试或遇到更好的大公司，甚至初级设计师的门槛也不能进入。
